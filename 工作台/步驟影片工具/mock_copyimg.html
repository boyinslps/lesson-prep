<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>示意畫面 - 複製圖片</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,'Microsoft JhengHei',sans-serif;background:#f1f1f1;height:640px;overflow:hidden;position:relative;color:#222}
.hd{height:56px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 40px;font-size:22px;color:#ff6a00;font-weight:bold}
.wrap{display:flex;gap:40px;padding:34px 80px}
.wrap img{width:560px;height:auto;border:1px solid #ccc;background:#fff}
.txt{font-size:26px;line-height:1.7;max-width:480px}
.txt small{display:block;color:#888;font-size:18px;margin-top:10px}
.tag{position:absolute;right:14px;top:66px;font-size:12px;color:#888;background:#fff;border:1px solid #ddd;border-radius:10px;padding:2px 8px;z-index:9}
.menu{position:absolute;left:420px;top:250px;width:330px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35);padding:6px 0;font-size:18px;z-index:8}
.menu div{padding:9px 20px}
.menu .hl{background:#e8f0fe}
.menu hr{border:0;border-top:1px solid #ddd;margin:4px 0}
</style></head><body>
<span class="tag">示意畫面</span>
<div class="hd">查核文章頁（示意）</div>
<div class="wrap"><img id="pic" src="shots/B_rumor.png"><div class="txt">網傳訊息的原始圖片<small>在圖片上按滑鼠右鍵，會跳出選單</small></div></div>
<div id="menu" class="menu" style="display:none">
 <div>在新分頁中開啟圖片</div><div>另存圖片為…</div><div id="copy" class="hl">複製圖片</div><div>複製圖片位址</div><hr><div>透過 Google 智慧鏡頭搜尋圖片</div>
</div>
<script>
var s=new URLSearchParams(location.search).get('s')||'menu';
if(s==='menu')document.getElementById('menu').style.display='block';
function R(id){var e=document.getElementById(id);var b=e.getBoundingClientRect();return {x:Math.round(b.left),y:Math.round(b.top),w:Math.round(b.width),h:Math.round(b.height)}}
window.RECTS=JSON.stringify({pic:R('pic'),copy:R('copy'),menu:R('menu')});
</script></body></html>
