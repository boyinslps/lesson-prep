<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>示意畫面 - 學習單</title>
<style>*{box-sizing:border-box}body{margin:0;width:1280px;height:640px;overflow:hidden;background:#f5f7fb;font-family:'Microsoft JhengHei',Arial,sans-serif;color:#243b53}
