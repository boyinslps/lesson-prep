<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>LINE 訊息（依網傳內容重製）</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:760px;height:520px;background:#8fa6cf;font-family:'Microsoft JhengHei',Arial,sans-serif;position:relative;overflow:hidden}
.av{position:absolute;left:22px;top:22px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#c9d3e8,#aab8d6)}
.name{position:absolute;left:100px;top:22px;width:120px;height:18px;border-radius:9px;background:rgba(255,255,255,.55)}
.bubble{position:absolute;left:100px;top:52px;width:560px;background:#fff;border-radius:22px;padding:18px 24px 20px;font-size:30px;line-height:1.5;color:#111}
.bubble:before{content:'';position:absolute;left:-12px;top:14px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.url{color:#2a6fd6;text-decoration:underline;font-size:26px;word-break:break-all}
.card{position:absolute;left:100px;top:262px;width:560px;background:#fff;border-radius:22px;overflow:hidden}
.card .pic{height:130px;background:linear-gradient(135deg,#2e7d5b,#1f5e44);position:relative}
.card .pic b{position:absolute;left:0;right:0;top:34px;text-align:center;color:#ffe066;font-size:36px;letter-spacing:4px}
.card .pic span{position:absolute;left:0;right:0;top:80px;text-align:center;color:#fff;font-size:24px}
.card .t{padding:10px 20px 14px;font-size:22px;color:#222}
.card .t i{display:block;font-style:normal;color:#777;font-size:19px;margin-top:2px}
.time{position:absolute;left:672px;top:470px;font-size:18px;color:#fff}
.tag{position:absolute;right:10px;top:8px;font-size:13px;color:#fff;background:rgba(0,0,0,.35);border-radius:10px;padding:2px 10px}
</style></head><body>
<span class="tag">依網傳內容重製</span>
<div class="av"></div><div class="name"></div>
<div class="bubble">親戚家小孩繪畫比賽<br>麻煩幫我投下 7 號小朋友 謝謝<br><span class="url">https://（網址已隱藏）</span></div>
<div class="card"><div class="pic"><b>創意繪畫比賽</b><span>🎨 小朋友們的畫作</span></div><div class="t">創意繪畫比賽<i>點這裡投票</i></div></div>
<div class="time">10:21</div>
</body></html>
