<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="資訊老師黃博胤">
<title>嵌入示範：把模擬 Windows 11 放進關卡網頁</title>
<style>
  body { margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #12161f; color: #e8ecf4; }
  header { padding: 12px 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .task { background: #1d2433; padding: 8px 14px; border-radius: 8px; }
  .task.done { background: #1d4a2e; }
  #wrap { margin: 0 18px; border: 1px solid #333; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 1100px; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  pre { margin: 12px 18px; padding: 10px; background: #0b0e14; border-radius: 8px; max-width: 1100px; max-height: 160px; overflow: auto; font-size: 12px; }
  button { padding: 6px 12px; border-radius: 6px; border: 0; background: #3b82f6; color: #fff; cursor: pointer; }
  footer { margin: 12px 18px; font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<header>
  <h1>關卡示範：把桌面上的「新增文字文件.txt」改名成「自我介紹.txt」</h1>
  <div id="task" class="task">⬜ 還沒完成</div>
  <button id="reset">重新開始</button>
  <button id="demo">看示範</button>
</header>
<div id="wrap"><iframe id="sim" src="../index.html?scene=practice-rename&amp;fast=1"></iframe></div>
<pre id="log">（模擬器傳來的事件會顯示在這裡）</pre>
<footer>made by 資訊老師黃博胤　｜　用法見 AI說明.md「做技能闖關關卡」</footer>

<script>
// ---- 和模擬器溝通的最小橋接：call("方法名", 參數…) → Promise ----
const sim = document.getElementById("sim");
let seq = 0; const waiting = {};
function call(method, ...args) {
  return new Promise((resolve, reject) => {
    const id = ++seq; waiting[id] = { resolve, reject };
    sim.contentWindow.postMessage({ sim: "win11", id, method, args }, "*");
  });
}
window.addEventListener("message", (e) => {
  const d = e.data; if (!d || e.source !== sim.contentWindow) return;
  if (d.sim === "win11" && waiting[d.id]) { d.ok ? waiting[d.id].resolve(d.result) : waiting[d.id].reject(new Error(d.error)); delete waiting[d.id]; }
  else if (d.sim === "win11-event") onEvent(d.type, d.data);
});

// ---- 判定：監聽事件，檢查檔案系統 ----
const logEl = document.getElementById("log");
function onEvent(type, data) {
  if (type.startsWith("demo:") || type === "ui:contextmenu") return;
  logEl.textContent = type + " " + JSON.stringify(data) + "\n" + logEl.textContent.slice(0, 1500);
  if (type === "fs:rename") check();
}
async function check() {
  const ok = await call("fs.exists", "C:\\Users\\學生\\桌面\\自我介紹.txt");
  const t = document.getElementById("task");
  t.textContent = ok ? "✅ 過關！檔案已經改名成「自我介紹.txt」" : "⬜ 還沒完成";
  t.classList.toggle("done", ok);
}

document.getElementById("reset").onclick = async () => { await call("reset"); document.getElementById("task").className = "task"; document.getElementById("task").textContent = "⬜ 還沒完成"; };
document.getElementById("demo").onclick = async () => {
  await call("reset");
  call("demo.run", [
    { do: "click", target: "desktop:icon:新增文字文件.txt" }, { do: "key", key: "F2" },
    { do: "type", text: "自我介紹", delay: 120 }, { do: "key", key: "Enter" },
  ]);
};
</script>
</body>
</html>
