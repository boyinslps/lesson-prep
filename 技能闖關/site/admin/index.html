<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="資訊老師黃博胤">
<meta name="description" content="看影片、做一次、過關！把上課最常卡住的電腦操作一關一關學會">
<title>教師後台｜電腦急救站</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a44; --sub:#5b6478; --mute:#8a91a3; --line:#e3e6ee; --bg:#f4f6fb; --paper:#ffffff;
  --navy:#22305e; --gold:#e2a63b; --gold-soft:#fdf1d8; --red:#d9534f; --red-soft:#fdecea; --green:#2f9e62; --green-soft:#e6f6ec;
  --ac:#3b7dd8; --ac-soft:#e5effc;
  --r:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img,video{max-width:100%;display:block}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.ico{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 頂端列 ===== */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:18px;text-decoration:none;letter-spacing:.5px}
.brand .ico{width:26px;height:26px;color:var(--gold)}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:15px;padding:4px 12px 4px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
.back:hover{background:rgba(255,255,255,.22)}
.lvname{font-weight:700;font-size:16px}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;flex-wrap:wrap}
.who label{display:flex;align-items:center;gap:4px;color:#cfd6ea}
.who input{width:44px;text-align:center;border:0;border-radius:8px;padding:3px 4px;font-weight:700;color:var(--navy);background:#fff}
.who input:focus{outline:3px solid var(--gold)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.pill.ok{background:#2f9e62}.pill.warn{background:#d9822b}.pill.bad{background:#c0392b}

/* ===== 首頁 ===== */
.hero{background:var(--paper);border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:26px;padding-bottom:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero h1{font-size:32px;line-height:1.25;margin:0 0 6px;font-weight:900}
.hero p{margin:0;color:var(--sub)}
.meter{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.bar{width:260px;max-width:100%;height:12px;border-radius:99px;background:#e9edf5;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#5cc98c);border-radius:99px;transition:width .5s}
.meter b{font-size:15px}
.certrow{display:flex;gap:10px;flex-wrap:wrap}
.cert{display:flex;flex-direction:column;align-items:center;gap:2px;width:108px;padding:10px 6px;border-radius:14px;border:1.5px dashed var(--line);text-align:center;font-size:13px;color:var(--mute);text-decoration:none}
.cert .ico{width:34px;height:34px}
.cert b{font-size:14px;color:var(--sub)}
.cert.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:#8a5a0c}
.cert.got b{color:#6b4508}

.cat{margin:26px 0}
.cat h2{display:flex;align-items:center;gap:10px;font-size:21px;margin:0 0 12px}
.cat h2 .badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--col)}
.cat h2 small{font-size:14px;font-weight:500;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px 16px 14px;border-radius:var(--r);background:var(--paper);border:1.5px solid var(--line);text-decoration:none;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(34,48,94,.10)}
.card .top{display:flex;align-items:center;gap:8px}
.code{font-weight:900;font-size:13px;padding:1px 8px;border-radius:7px;background:var(--soft);color:var(--col)}
.core{font-size:12px;font-weight:700;color:#8a5a0c;background:var(--gold-soft);padding:1px 7px;border-radius:7px}
.card .st{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.card h3{margin:2px 0 0;font-size:18px}
.card p{margin:0;font-size:14px;color:var(--sub);line-height:1.55}
.card .need{font-size:13px;color:var(--mute)}
.card.passed{border-color:var(--green);background:linear-gradient(180deg,#fff,var(--green-soft))}
.card.passed .st{background:var(--green);color:#fff}
.card.open .st{border:2px solid var(--line)}
.card.locked{opacity:.62;background:#f7f8fb}
.card.locked .st{color:var(--mute)}
.card.locked:hover{transform:none;box-shadow:none}

/* ===== 關卡頁 ===== */
.lvhead{background:var(--paper);border-bottom:1px solid var(--line)}
.lvhead .wrap{padding-top:18px;padding-bottom:0}
.lvhead h1{margin:6px 0 4px;font-size:28px;font-weight:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvhead p{margin:0 0 14px;color:var(--sub)}
.tabs{display:flex;gap:6px}
.tabs button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 18px 12px;font-weight:700;font-size:17px;color:var(--mute);cursor:pointer;border-bottom:4px solid transparent}
.tabs button .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e9edf5;font-size:14px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ac)}
.tabs button.on .n{background:var(--ac);color:#fff}
.tabs button.done .n{background:var(--green);color:#fff}
.panel{display:none;padding:22px 0 40px}
.panel.on{display:block}
.box{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:20px 22px}
.box + .box{margin-top:14px}
.box h2{margin:0 0 10px;font-size:20px}
.vid{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid video{width:100%;height:100%}
.novid{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#f1f4fa;color:var(--sub);font-size:15px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 46px;border-bottom:1px dashed var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:32px;height:32px;border-radius:50%;background:var(--ac-soft);color:var(--ac);font-weight:900;display:grid;place-items:center}
kbd{display:inline-block;min-width:1.6em;padding:0 7px;border:1.5px solid #c9cfdc;border-bottom-width:3px;border-radius:7px;background:#fff;font:700 .88em/1.6 'Noto Sans TC',system-ui,sans-serif;text-align:center;color:var(--ink);margin:0 1px}
.tip{display:flex;gap:8px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--gold-soft);font-size:15px}
.tip .ico{color:#b07a16;margin-top:4px}
.go{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 22px;background:var(--ac);color:#fff;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none}
.go:hover{filter:brightness(1.07)}
.go.ghost{background:#fff;color:var(--ac);border:2px solid var(--ac)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* 任務與判定區 */
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:12px;background:#f1f4fa;margin-bottom:10px;font-weight:500}
.task .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #c9cfdc;display:grid;place-items:center;margin-top:1px;background:#fff}
.task.done{background:var(--green-soft)}
.task.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.task.now{outline:2px solid var(--ac)}
.hint{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:15px;display:none}
.hint.on{display:block}
.hint.info{background:var(--ac-soft);color:#1d4f96}
.hint.bad{background:var(--red-soft);color:#9b2c28}
.passage{padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;line-height:2}
.passage mark{background:none;border-bottom:3px dotted var(--ac);color:inherit}
.field{display:block;width:100%;min-height:76px;border:2px solid #c9cfdc;border-radius:12px;padding:10px 12px;background:#fff;resize:vertical}
.field:focus{outline:none;border-color:var(--ac)}
.lbl{display:block;font-weight:700;font-size:15px;margin:12px 0 6px;color:var(--sub)}
.doc{min-height:150px;border:1.5px solid #d4d9e4;border-radius:6px;padding:26px 30px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);font-family:'Noto Sans TC',sans-serif;font-size:16px;color:#222;line-height:1.9}
.doc:focus{outline:2px solid var(--ac)}
.doc .slot{color:#9aa1b2;background:#f3f5f9;border-radius:4px;padding:0 4px}
.docbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1.5px solid #d4d9e4;border-bottom:0;border-radius:6px 6px 0 0;background:#f6f7fa;font-size:13px;color:var(--mute)}
.docbar + .doc{border-radius:0 0 6px 6px}
.rich{padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff}

/* 過關 */
.pass{position:fixed;inset:0;background:rgba(20,28,56,.55);display:none;place-items:center;z-index:50;padding:16px}
.pass.on{display:grid}
.pass .card2{background:#fff;border-radius:22px;padding:28px 30px;text-align:center;max-width:420px;width:100%;animation:pop .35s ease-out}
.pass .medal{width:110px;height:110px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe7a8,var(--gold));color:#fff;box-shadow:0 6px 0 #c48a22}
.pass .medal .ico{width:58px;height:58px;stroke-width:2.4}
.pass h2{margin:8px 0 4px;font-size:26px}
.pass p{margin:0 0 6px;color:var(--sub)}
.pass .actions{justify-content:center}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.sign{margin-left:auto}

@media (max-width:640px){
  .hero .wrap{grid-template-columns:1fr}
  .hero h1{font-size:26px}
  .tabs button{padding:8px 10px 10px;font-size:15px}
  .box{padding:16px}
  .doc{padding:18px}
  .who{margin-left:0}
}

/* 上傳區 */
.drop{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;min-height:96px;border:2.5px dashed #c9cfdc;border-radius:14px;background:#fafbfd;color:var(--sub);cursor:pointer;text-align:center;padding:12px}
.drop b{color:var(--ac);background:var(--ac-soft);padding:4px 14px;border-radius:999px}
.drop:hover,.drop.on{border-color:var(--ac);background:var(--ac-soft)}

/* 模擬瀏覽器＋彈出視窗（popup 判定器）*/
.fb{position:relative;border:1.5px solid #cfd5e1;border-radius:12px;overflow:hidden;background:#fff;margin-top:6px;min-height:340px}
.fb-tabs{background:#dee3ec;padding:6px 10px 0}
.fb-tab{display:inline-block;background:#fff;border-radius:9px 9px 0 0;padding:5px 16px;font-size:13px;max-width:220px}
.fb-url{background:#fff;border-bottom:1px solid #e3e6ee;padding:6px 14px;font-size:13px;color:#555}
.fb-url::before{content:'';display:inline-block;width:9px;height:9px;border:2px solid #9aa1b2;border-radius:50%;margin-right:8px;vertical-align:-1px}
.fb-page{padding:20px 24px;color:#333}
.fb-page h3{margin:0 0 8px}
.fb-layer{position:absolute;inset:0;pointer-events:none}
.fb-layer>*{pointer-events:auto}
.pp{background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:16px 18px;font-size:15px}
.pp p{margin:4px 0 10px;color:#555}
.pp-row{display:flex;gap:8px;flex-wrap:wrap}
.pp button{border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;background:#1a73e8;color:#fff}
.pp button.pp-plain{background:#fff;color:#1a73e8;border:1.5px solid #c9d3e6}
.pp-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:12px}
.pp-cookie{position:absolute;left:12px;right:12px;bottom:12px}
.pp-notify{position:absolute;left:14px;top:66px;width:250px}
.pp-ad{position:relative;width:min(360px,100%);text-align:center;background:linear-gradient(160deg,#ff9a3c,#ff3c7d);color:#fff;padding:26px 18px 18px}
.pp-adart{font-size:26px;font-weight:900;line-height:1.3;margin:6px 0 14px}
.pp-adart small{font-size:15px;font-weight:500}
.pp-ad .pp-big{background:#ffe14d;color:#222;font-size:19px;padding:11px 26px;display:block;margin:0 auto 8px}
.pp-ad .pp-fake{background:rgba(255,255,255,.25);font-size:13px;padding:4px 12px}
.pp-x{position:absolute;right:6px;top:2px;font-size:18px;line-height:1;color:rgba(255,255,255,.75);cursor:pointer;padding:4px}
.pp-x.l{right:auto;left:6px}
.pp-wait{position:absolute;right:8px;top:6px;font-size:12px;opacity:.85}
.pp-prize{width:min(380px,100%);text-align:center;border:4px solid #f5c542}
.pp-trophy{font-size:26px;font-weight:900;color:#d4380d}
.pp-red{color:#d4380d!important;font-weight:700}
.pp-prize .pp-row{justify-content:center}
.pp-prize .pp-big{background:#d4380d;font-size:18px;padding:10px 24px}
.pp-sub{width:min(340px,100%);text-align:center}
.pp-sub input{width:100%;border:1.5px solid #c9d3e6;border-radius:8px;padding:7px 10px;margin-bottom:8px}
.pp-sub .pp-row{justify-content:center}
.pp-no{display:inline-block;margin-top:8px;font-size:12px;color:#999}
.pulse{animation:pulse 1.2s infinite;outline:3px solid #2f9e62;outline-offset:2px}
@keyframes pulse{50%{outline-color:transparent}}

/* 測驗（quiz 判定器）*/
.qz-opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.qz-opt{border:2px solid #c9cfdc;background:#fff;border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;font-weight:500}
.qz-opt:hover{border-color:var(--ac)}
.qz-opt.no{border-color:var(--red);background:var(--red-soft);color:#9b2c28}
.qz-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;border-radius:12px;background:#f1f4fa;margin-bottom:12px}
.qz-item{display:inline-block;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid #c9cfdc;font-weight:700;cursor:grab;user-select:none}
.qz-item.on{border-color:var(--ac);background:var(--ac-soft)}
.qz-item.ok{border-color:var(--green);background:var(--green-soft);cursor:default}
.qz-buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.qz-bucket{border:2.5px dashed #c9cfdc;border-radius:14px;padding:10px;min-height:110px;cursor:pointer;background:#fff}
.qz-bucket b{display:block;margin-bottom:6px}
.qz-in{display:flex;flex-wrap:wrap;gap:6px}

/* 地圖先修連線 */
.grid{position:relative;column-gap:34px}
.grid svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.grid svg.links path{fill:none;stroke:#b8c0d2;stroke-width:2.5;stroke-dasharray:6 5}
.grid svg.links path.done{stroke:var(--green);stroke-dasharray:none}
.card{z-index:1}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid #e3e6ee;border-top-color:#1a73e8;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>

<script>
/* ============================================================
   電腦急救站｜共用程式（地圖頁、關卡頁都用這一份）
   ------------------------------------------------------------
   window.SITE 由 build.py 注入：{config, levels:[...], base}
   紀錄：localStorage「skillQuest_年-班-座」＋ Firestore skillQuest/{年-班-座}
   ============================================================ */
(function(){
  var SITE = window.SITE, CFG = SITE.config, LEVELS = SITE.levels;
  var ID_KEY = 'wk_identity';
  function $(id){return document.getElementById(id);}
  function digits(s){return String(s||'').replace(/\D/g,'');}
  var Q = window.Quest = {levels: LEVELS, config: CFG};
  Q.byCode = {}; LEVELS.forEach(function(l){Q.byCode[l.code]=l;});

  /* ---------- 小工具 ---------- */
  var toastT;
  Q.toast = function(t){var e=$('toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on');},2400);};
  Q.icon = function(name,cls){return '<svg class="ico'+(cls?' '+cls:'')+'"><use href="#i-'+name+'"/></svg>';};
  Q.esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

  /* ---------- 身分（年級／班級／座號）---------- */
  Q.getId = function(){
    var s={};try{s=JSON.parse(localStorage.getItem(ID_KEY)||'{}')||{};}catch(e){}
    return {grade:+s.grade||0, className:+s.className||0, studentId:+s.studentId||0};
  };
  Q.idValid = function(i){i=i||Q.getId();return i.grade>=3&&i.grade<=6&&i.className>=1&&i.className<=20&&i.studentId>=1&&i.studentId<=40;};
  Q.docId = function(i){i=i||Q.getId();return i.grade+'-'+i.className+'-'+i.studentId;};
  function setId(i){try{localStorage.setItem(ID_KEY,JSON.stringify(i));}catch(e){}}

  /* ---------- 紀錄 ---------- */
  var PROG = {levels:{}, certs:{}};
  function lkey(){return 'skillQuest_'+Q.docId();}
  function readLocal(){try{var o=JSON.parse(localStorage.getItem(lkey())||'{}')||{};return {levels:o.levels||{},certs:o.certs||{}};}catch(e){return {levels:{},certs:{}};}}
  function writeLocal(){try{localStorage.setItem(lkey(),JSON.stringify(PROG));}catch(e){}}
  Q.progress = function(){return PROG;};
  Q.passed = function(code){return !!PROG.levels[code];};
  Q.status = function(code){
    if(Q.passed(code))return 'passed';
    var l=Q.byCode[code];
    return (l.prereq||[]).every(Q.passed)?'open':'locked';
  };

  /* ---------- 證書條件 ---------- */
  Q.certOpen = function(c){return LEVELS.length>=((c.rule||{}).minLevels||0);};
  Q.certMet = function(c){
    var r=c.rule||{}, lv=LEVELS;
    if(!Q.certOpen(c))return false;
    if(r.all&&!lv.every(function(l){return Q.passed(l.code);}))return false;
    if(r.core&&!lv.filter(function(l){return l.core;}).every(function(l){return Q.passed(l.code);}))return false;
    if(r.perCategory){
      var ok=CFG.categories.every(function(cat){
        var inCat=lv.filter(function(l){return l.category===cat.id;});
        if(!inCat.length)return true;
        var need=Math.min(r.perCategory,inCat.length);
        return inCat.filter(function(l){return Q.passed(l.code);}).length>=need;
      });
      if(!ok)return false;
    }
    return true;
  };
  function certCode(cid){
    var s=Q.docId()+'|'+cid+'|'+Date.now(), h=0;
    for(var k=0;k<s.length;k++){h=(h*31+s.charCodeAt(k))>>>0;}
    return cid+'-'+h.toString(36).toUpperCase().slice(-6);
  }
  // 條件達成就頒發；頒發後永久保留（之後新增關卡也不會收回）
  Q.awardCerts = function(){
    var fresh=[];
    CFG.certs.forEach(function(c){
      if(!PROG.certs[c.id]&&Q.certMet(c)){
        PROG.certs[c.id]={awardedAt:Date.now(),code:certCode(c.id),levelSnapshot:LEVELS.map(function(l){return l.code;})};
        fresh.push(c);
      }
    });
    return fresh;
  };

  /* ---------- Firebase ---------- */
  var db=null,auth=null;
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
  var fbReady=new Promise(function(resolve){
    if(!CFG.firebase||location.protocol==='file:'){resolve(false);return;}
    var base='https://www.gstatic.com/firebasejs/10.8.0/';
    loadScript(base+'firebase-app-compat.js')
      .then(function(){return loadScript(base+'firebase-auth-compat.js');})
      .then(function(){return loadScript(base+'firebase-firestore-compat.js');})
      .then(function(){if(!firebase.apps.length)firebase.initializeApp(CFG.firebase);db=firebase.firestore();auth=firebase.auth();resolve(true);})
      .catch(function(e){console.warn('Firebase 載入失敗，改成只存在這台電腦',e);resolve(false);});
  });
  Q.firebase = function(){return fbReady.then(function(ok){return ok?{db:db,auth:auth,coll:coll}:null;});};
  function ensureAuth(){return auth.currentUser?Promise.resolve(auth.currentUser):auth.signInAnonymously().then(function(c){return c.user;});}
  function coll(){return db.collection(CFG.collection||'skillQuest');}

  function stat(cls,t){var e=$('saveStat');if(!e)return;e.className='pill'+(cls?' '+cls:'');e.textContent=t;}

  // 雲端與本機合併：關卡取「最早過關」那筆；證書取最早頒發那筆
  function merge(a,b){
    Object.keys(b||{}).forEach(function(k){if(!a[k]||(b[k].passedAt||b[k].awardedAt||0)<(a[k].passedAt||a[k].awardedAt||0))a[k]=b[k];});
    return a;
  }

  var listeners=[];
  Q.onChange = function(fn){listeners.push(fn);fn();};
  function emit(){listeners.forEach(function(fn){try{fn();}catch(e){console.error(e);}});}

  var loadedFor='';
  Q.load = function(){
    if(!Q.idValid()){PROG={levels:{},certs:{}};stat('warn','先填年級、班級、座號');emit();return Promise.resolve();}
    var id=Q.docId();loadedFor=id;
    PROG=readLocal();
    // 之前就達成、但當時證書還沒開放的，進網站時補發
    var freshLocal=Q.awardCerts().length;if(freshLocal)writeLocal();
    emit();
    stat('','讀取中…');
    return fbReady.then(function(ok){
      if(!ok){stat('warn','紀錄存在這台電腦');return;}
      return ensureAuth().then(function(){return coll().doc(id).get();}).then(function(doc){
        if(loadedFor!==id)return;
        var c=doc.exists?doc.data():{};
        merge(PROG.levels,c.levels);merge(PROG.certs,c.certs);
        Q.awardCerts();
        writeLocal();emit();
        stat('ok','已連上雲端');
        // 本機有、雲端沒有的（例如之前離線過關）補上傳
        var needPush=Object.keys(PROG.levels).some(function(k){return !(c.levels||{})[k];})||Object.keys(PROG.certs).some(function(k){return !(c.certs||{})[k];});
        if(needPush)return push();
      });
    }).catch(function(e){console.warn('讀取失敗',e);stat('bad','雲端讀不到，先存在這台電腦');});
  };
  function push(){
    var i=Q.getId();
    return fbReady.then(function(ok){
      if(!ok){stat('warn','紀錄存在這台電腦');return false;}
      var payload={grade:i.grade,className:i.className,studentId:i.studentId,levels:PROG.levels,certs:PROG.certs,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
      return ensureAuth().then(function(){return coll().doc(Q.docId(i)).set(payload,{merge:true});})
        .then(function(){stat('ok','已存到雲端');return true;})
        .catch(function(e){console.warn('雲端存檔失敗',e);stat('bad','雲端沒存到，先存在這台電腦');return false;});
    });
  }

  // 過關：記錄＋檢查證書。回傳 {fresh:[新拿到的證書]}
  Q.recordPass = function(code,info){
    if(!Q.idValid())return Promise.resolve({fresh:[],noId:true});
    if(!PROG.levels[code])PROG.levels[code]={passedAt:Date.now(),tries:info.tries||1,seconds:Math.round(info.seconds||0)};
    var fresh=Q.awardCerts();
    writeLocal();emit();
    return push().then(function(){return {fresh:fresh};});
  };

  /* ---------- 身分欄位 ---------- */
  Q.initIdBar = function(){
    if(!$('idG'))return Q.load();
    var s=Q.getId();
    if(s.grade)$('idG').value=s.grade;if(s.className)$('idC').value=s.className;if(s.studentId)$('idS').value=s.studentId;
    var t;
    ['idG','idC','idS'].forEach(function(id){
      $(id).addEventListener('input',function(){
        var d=digits(this.value);if(d!==this.value)this.value=d;
        setId({grade:+$('idG').value||0,className:+$('idC').value||0,studentId:+$('idS').value||0});
        clearTimeout(t);t=setTimeout(Q.load,500);
      });
    });
    return Q.load();
  };
})();

</script>

<script>
/* 教師後台：Google 登入（只有 firestore.rules 裡的老師帳號能列出全班）。?demo=1 用假資料看畫面。 */
(function(){
  var Q=Quest, CFG=Q.config, L=Q.levels, demo=/demo=1/.test(location.search), FB=null, rows=[];
  function $(id){return document.getElementById(id);}
  function msg(t){$('aMsg').innerHTML=t;}
  function d2(ms){var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate();}

  Q.firebase().then(function(fb){
    FB=fb;
    if(demo){$('who').textContent='示範資料模式';$('login').style.display='none';$('aG').value=4;$('aC').value=1;load();return;}
    if(!fb){msg('Firebase 載入失敗（或用 file:// 開啟），無法讀取資料。');return;}
    fb.auth.onAuthStateChanged(function(u){
      $('who').textContent=u&&!u.isAnonymous?u.email:'';
      $('login').textContent=u&&!u.isAnonymous?'登出':'Google 登入';
    });
  });
  $('login').addEventListener('click',function(){
    if(!FB)return;
    var u=FB.auth.currentUser;
    if(u&&!u.isAnonymous){FB.auth.signOut();return;}
    FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){msg('登入失敗：'+Q.esc(e.code||e.message)+'（Firebase Console → Authentication 要啟用 Google 登入）');});
  });

  function fake(g,c){
    var out=[];for(var s=1;s<=28;s++){var lv={},n=Math.floor(Math.random()*(L.length+1));
      L.slice(0,n).forEach(function(l,k){lv[l.code]={passedAt:Date.now()-k*86400000,tries:1+Math.floor(Math.random()*3),seconds:20+Math.floor(Math.random()*200)};});
      var certs=n===L.length?{T1:{awardedAt:Date.now(),code:'T1-DEMO'+s}}:{};
      out.push({id:g+'-'+c+'-'+s,grade:g,className:c,studentId:s,levels:lv,certs:certs});}
    return Promise.resolve(out);
  }
  function fetchClass(g,c){
    if(demo)return fake(g,c);
    return FB.coll().where('grade','==',g).where('className','==',c).get().then(function(snap){
      var out=[];snap.forEach(function(d){var o=d.data();o.id=d.id;out.push(o);});return out;});
  }
  function load(){
    var g=+$('aG').value, c=+$('aC').value;
    if(!g||!c){msg('請填年級和班級。');return;}
    if(!demo&&!(FB&&FB.auth.currentUser&&!FB.auth.currentUser.isAnonymous)){msg('請先用老師的 Google 帳號登入。');return;}
    msg('讀取中…');
    fetchClass(g,c).then(function(r){rows=r.sort(function(a,b){return a.studentId-b.studentId;});draw(g,c);})
      .catch(function(e){msg('讀取失敗：'+Q.esc(e.code||e.message)+'（確認登入的是老師帳號，且 firestore.rules 已發布）');});
  }
  function draw(g,c){
    if(!rows.length){msg(g+' 年 '+c+' 班還沒有人留下紀錄。');$('aTable').style.display='none';return;}
    var h='<table class="ad"><thead><tr><th>座號</th><th>過關</th>'+L.map(function(l){return '<th class="lv" title="'+Q.esc(l.title)+'">'+l.code+' '+Q.esc(l.title)+'</th>';}).join('')+
      CFG.certs.map(function(ct){return '<th class="lv">'+Q.esc(ct.name)+'</th>';}).join('')+'</tr></thead><tbody>';
    rows.forEach(function(r){
      var lv=r.levels||{}, n=L.filter(function(l){return lv[l.code];}).length;
      h+='<tr><td>'+r.studentId+'</td><td>'+n+'</td>'+L.map(function(l){var x=lv[l.code];
        return x?'<td class="p" data-id="'+r.id+'" data-lv="'+l.code+'" title="'+d2(x.passedAt)+' 過關，嘗試 '+(x.tries||1)+' 次，'+Math.round(x.seconds||0)+' 秒（點一下可重設）">'+d2(x.passedAt)+'</td>':'<td></td>';}).join('')+
        CFG.certs.map(function(ct){var x=(r.certs||{})[ct.id];return x?'<td class="c" title="'+Q.esc(x.code)+'">'+d2(x.awardedAt)+'</td>':'<td></td>';}).join('')+'</tr>';
    });
    h+='<tr class="sum"><td>通過率</td><td></td>'+L.map(function(l){var k=rows.filter(function(r){return (r.levels||{})[l.code];}).length;return '<td>'+Math.round(k/rows.length*100)+'%</td>';}).join('')+
      CFG.certs.map(function(ct){var k=rows.filter(function(r){return (r.certs||{})[ct.id];}).length;return '<td>'+k+' 人</td>';}).join('')+'</tr></tbody></table>';
    $('aTable').innerHTML=h;$('aTable').style.display='block';
    msg(g+' 年 '+c+' 班，共 '+rows.length+' 人有紀錄。日期上滑鼠可看嘗試次數與秒數；點日期可以重設該關。'+(demo?'（示範資料）':''));
  }
  $('aTable').addEventListener('click',function(e){
    var td=e.target.closest('td.p');if(!td)return;
    var id=td.dataset.id, code=td.dataset.lv;
    if(!confirm('確定要重設 '+id+' 的 '+code+'？學生要重新挑戰這一關。（已頒發的證書不會收回）'))return;
    var done=function(){rows.forEach(function(r){if(r.id===id&&r.levels)delete r.levels[code];});draw(+$('aG').value,+$('aC').value);};
    if(demo){done();return;}
    var up={};up['levels.'+code]=firebase.firestore.FieldValue.delete();
    FB.coll().doc(id).update(up).then(done).catch(function(e){msg('重設失敗：'+Q.esc(e.code||e.message));});
  });
  $('loadBtn').addEventListener('click',load);
  $('findBtn').addEventListener('click',function(){
    var code=$('aCode').value.trim().toUpperCase();if(!code)return;
    var hit=function(list){for(var i=0;i<list.length;i++){var cs=list[i].certs||{};for(var k in cs)if(cs[k].code===code)return {r:list[i],c:k,x:cs[k]};}return null;};
    var show=function(f){if(!f){msg('查無證書編號 '+Q.esc(code)+'。');return;}
      var ct=CFG.certs.filter(function(c){return c.id===f.c;})[0];
      msg('證書編號 <b>'+Q.esc(code)+'</b>：'+f.r.grade+' 年 '+f.r.className+' 班 '+f.r.studentId+' 號，「'+Q.esc(ct?ct.name:f.c)+'」，'+new Date(f.x.awardedAt).toLocaleDateString('zh-TW')+' 頒發。');};
    if(demo){show(hit(rows));return;}
    if(!(FB&&FB.auth.currentUser&&!FB.auth.currentUser.isAnonymous)){msg('請先用老師的 Google 帳號登入。');return;}
    FB.coll().get().then(function(snap){var all=[];snap.forEach(function(d){var o=d.data();o.id=d.id;all.push(o);});show(hit(all));})
      .catch(function(e){msg('查驗失敗：'+Q.esc(e.code||e.message));});
  });
})();
</script>
