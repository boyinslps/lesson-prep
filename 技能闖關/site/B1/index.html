<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="資訊老師黃博胤">
<meta name="description" content="看影片、做一次、過關！把上課最常卡住的電腦操作一關一關學會">
<title>B1 複製貼上｜電腦急救站</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a44; --sub:#5b6478; --mute:#8a91a3; --line:#e3e6ee; --bg:#f4f6fb; --paper:#ffffff;
  --navy:#22305e; --gold:#e2a63b; --gold-soft:#fdf1d8; --red:#d9534f; --red-soft:#fdecea; --green:#2f9e62; --green-soft:#e6f6ec;
  --ac:#3b7dd8; --ac-soft:#e5effc;
  --r:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img,video{max-width:100%;display:block}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.ico{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 頂端列 ===== */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:18px;text-decoration:none;letter-spacing:.5px}
.brand .ico{width:26px;height:26px;color:var(--gold)}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:15px;padding:4px 12px 4px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
.back:hover{background:rgba(255,255,255,.22)}
.lvname{font-weight:700;font-size:16px}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;flex-wrap:wrap}
.who label{display:flex;align-items:center;gap:4px;color:#cfd6ea}
.who input{width:44px;text-align:center;border:0;border-radius:8px;padding:3px 4px;font-weight:700;color:var(--navy);background:#fff}
.who input:focus{outline:3px solid var(--gold)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.pill.ok{background:#2f9e62}.pill.warn{background:#d9822b}.pill.bad{background:#c0392b}

/* ===== 首頁 ===== */
.hero{background:var(--paper);border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:26px;padding-bottom:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero h1{font-size:32px;line-height:1.25;margin:0 0 6px;font-weight:900}
.hero p{margin:0;color:var(--sub)}
.meter{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.bar{width:260px;max-width:100%;height:12px;border-radius:99px;background:#e9edf5;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#5cc98c);border-radius:99px;transition:width .5s}
.meter b{font-size:15px}
.certrow{display:flex;gap:10px;flex-wrap:wrap}
.cert{display:flex;flex-direction:column;align-items:center;gap:2px;width:108px;padding:10px 6px;border-radius:14px;border:1.5px dashed var(--line);text-align:center;font-size:13px;color:var(--mute);text-decoration:none}
.cert .ico{width:34px;height:34px}
.cert b{font-size:14px;color:var(--sub)}
.cert.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:#8a5a0c}
.cert.got b{color:#6b4508}

.cat{margin:26px 0}
.cat h2{display:flex;align-items:center;gap:10px;font-size:21px;margin:0 0 12px}
.cat h2 .badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--col)}
.cat h2 small{font-size:14px;font-weight:500;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px 16px 14px;border-radius:var(--r);background:var(--paper);border:1.5px solid var(--line);text-decoration:none;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(34,48,94,.10)}
.card .top{display:flex;align-items:center;gap:8px}
.code{font-weight:900;font-size:13px;padding:1px 8px;border-radius:7px;background:var(--soft);color:var(--col)}
.core{font-size:12px;font-weight:700;color:#8a5a0c;background:var(--gold-soft);padding:1px 7px;border-radius:7px}
.card .st{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.card h3{margin:2px 0 0;font-size:18px}
.card p{margin:0;font-size:14px;color:var(--sub);line-height:1.55}
.card .need{font-size:13px;color:var(--mute)}
.card.passed{border-color:var(--green);background:linear-gradient(180deg,#fff,var(--green-soft))}
.card.passed .st{background:var(--green);color:#fff}
.card.open .st{border:2px solid var(--line)}
.card.locked{opacity:.62;background:#f7f8fb}
.card.locked .st{color:var(--mute)}
.card.locked:hover{transform:none;box-shadow:none}

/* ===== 關卡頁 ===== */
.lvhead{background:var(--paper);border-bottom:1px solid var(--line)}
.lvhead .wrap{padding-top:18px;padding-bottom:0}
.lvhead h1{margin:6px 0 4px;font-size:28px;font-weight:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvhead p{margin:0 0 14px;color:var(--sub)}
.tabs{display:flex;gap:6px}
.tabs button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 18px 12px;font-weight:700;font-size:17px;color:var(--mute);cursor:pointer;border-bottom:4px solid transparent}
.tabs button .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e9edf5;font-size:14px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ac)}
.tabs button.on .n{background:var(--ac);color:#fff}
.tabs button.done .n{background:var(--green);color:#fff}
.panel{display:none;padding:22px 0 40px}
.panel.on{display:block}
.box{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:20px 22px}
.box + .box{margin-top:14px}
.box h2{margin:0 0 10px;font-size:20px}
.vid{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid video{width:100%;height:100%}
.novid{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#f1f4fa;color:var(--sub);font-size:15px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 46px;border-bottom:1px dashed var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:32px;height:32px;border-radius:50%;background:var(--ac-soft);color:var(--ac);font-weight:900;display:grid;place-items:center}
kbd{display:inline-block;min-width:1.6em;padding:0 7px;border:1.5px solid #c9cfdc;border-bottom-width:3px;border-radius:7px;background:#fff;font:700 .88em/1.6 'Noto Sans TC',system-ui,sans-serif;text-align:center;color:var(--ink);margin:0 1px}
.tip{display:flex;gap:8px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--gold-soft);font-size:15px}
.tip .ico{color:#b07a16;margin-top:4px}
.go{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 22px;background:var(--ac);color:#fff;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none}
.go:hover{filter:brightness(1.07)}
.go.ghost{background:#fff;color:var(--ac);border:2px solid var(--ac)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* 任務與判定區 */
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:12px;background:#f1f4fa;margin-bottom:10px;font-weight:500}
.task .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #c9cfdc;display:grid;place-items:center;margin-top:1px;background:#fff}
.task.done{background:var(--green-soft)}
.task.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.task.now{outline:2px solid var(--ac)}
.hint{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:15px;display:none}
.hint.on{display:block}
.hint.info{background:var(--ac-soft);color:#1d4f96}
.hint.bad{background:var(--red-soft);color:#9b2c28}
.passage{padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;line-height:2}
.passage mark{background:none;border-bottom:3px dotted var(--ac);color:inherit}
.field{display:block;width:100%;min-height:76px;border:2px solid #c9cfdc;border-radius:12px;padding:10px 12px;background:#fff;resize:vertical}
.field:focus{outline:none;border-color:var(--ac)}
.lbl{display:block;font-weight:700;font-size:15px;margin:12px 0 6px;color:var(--sub)}
.doc{min-height:150px;border:1.5px solid #d4d9e4;border-radius:6px;padding:26px 30px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);font-family:'Noto Sans TC',sans-serif;font-size:16px;color:#222;line-height:1.9}
.doc:focus{outline:2px solid var(--ac)}
.doc .slot{color:#9aa1b2;background:#f3f5f9;border-radius:4px;padding:0 4px}
.docbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1.5px solid #d4d9e4;border-bottom:0;border-radius:6px 6px 0 0;background:#f6f7fa;font-size:13px;color:var(--mute)}
.docbar + .doc{border-radius:0 0 6px 6px}
.rich{padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff}

/* 過關 */
.pass{position:fixed;inset:0;background:rgba(20,28,56,.55);display:none;place-items:center;z-index:50;padding:16px}
.pass.on{display:grid}
.pass .card2{background:#fff;border-radius:22px;padding:28px 30px;text-align:center;max-width:420px;width:100%;animation:pop .35s ease-out}
.pass .medal{width:110px;height:110px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe7a8,var(--gold));color:#fff;box-shadow:0 6px 0 #c48a22}
.pass .medal .ico{width:58px;height:58px;stroke-width:2.4}
.pass h2{margin:8px 0 4px;font-size:26px}
.pass p{margin:0 0 6px;color:var(--sub)}
.pass .actions{justify-content:center}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.sign{margin-left:auto}

@media (max-width:640px){
  .hero .wrap{grid-template-columns:1fr}
  .hero h1{font-size:26px}
  .tabs button{padding:8px 10px 10px;font-size:15px}
  .box{padding:16px}
  .doc{padding:18px}
  .who{margin-left:0}
}

/* 上傳區 */
.drop{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;min-height:96px;border:2.5px dashed #c9cfdc;border-radius:14px;background:#fafbfd;color:var(--sub);cursor:pointer;text-align:center;padding:12px}
.drop b{color:var(--ac);background:var(--ac-soft);padding:4px 14px;border-radius:999px}
.drop:hover,.drop.on{border-color:var(--ac);background:var(--ac-soft)}

/* 模擬瀏覽器＋彈出視窗（popup 判定器）*/
.fb{position:relative;border:1.5px solid #cfd5e1;border-radius:12px;overflow:hidden;background:#fff;margin-top:6px;min-height:340px}
.fb-tabs{background:#dee3ec;padding:6px 10px 0}
.fb-tab{display:inline-block;background:#fff;border-radius:9px 9px 0 0;padding:5px 16px;font-size:13px;max-width:220px}
.fb-url{background:#fff;border-bottom:1px solid #e3e6ee;padding:6px 14px;font-size:13px;color:#555}
.fb-url::before{content:'';display:inline-block;width:9px;height:9px;border:2px solid #9aa1b2;border-radius:50%;margin-right:8px;vertical-align:-1px}
.fb-page{padding:20px 24px;color:#333}
.fb-page h3{margin:0 0 8px}
.fb-layer{position:absolute;inset:0;pointer-events:none}
.fb-layer>*{pointer-events:auto}
.pp{background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:16px 18px;font-size:15px}
.pp p{margin:4px 0 10px;color:#555}
.pp-row{display:flex;gap:8px;flex-wrap:wrap}
.pp button{border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;background:#1a73e8;color:#fff}
.pp button.pp-plain{background:#fff;color:#1a73e8;border:1.5px solid #c9d3e6}
.pp-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:12px}
.pp-cookie{position:absolute;left:12px;right:12px;bottom:12px}
.pp-notify{position:absolute;left:14px;top:66px;width:250px}
.pp-ad{position:relative;width:min(360px,100%);text-align:center;background:linear-gradient(160deg,#ff9a3c,#ff3c7d);color:#fff;padding:26px 18px 18px}
.pp-adart{font-size:26px;font-weight:900;line-height:1.3;margin:6px 0 14px}
.pp-adart small{font-size:15px;font-weight:500}
.pp-ad .pp-big{background:#ffe14d;color:#222;font-size:19px;padding:11px 26px;display:block;margin:0 auto 8px}
.pp-ad .pp-fake{background:rgba(255,255,255,.25);font-size:13px;padding:4px 12px}
.pp-x{position:absolute;right:6px;top:2px;font-size:18px;line-height:1;color:rgba(255,255,255,.75);cursor:pointer;padding:4px}
.pp-x.l{right:auto;left:6px}
.pp-wait{position:absolute;right:8px;top:6px;font-size:12px;opacity:.85}
.pp-prize{width:min(380px,100%);text-align:center;border:4px solid #f5c542}
.pp-trophy{font-size:26px;font-weight:900;color:#d4380d}
.pp-red{color:#d4380d!important;font-weight:700}
.pp-prize .pp-row{justify-content:center}
.pp-prize .pp-big{background:#d4380d;font-size:18px;padding:10px 24px}
.pp-sub{width:min(340px,100%);text-align:center}
.pp-sub input{width:100%;border:1.5px solid #c9d3e6;border-radius:8px;padding:7px 10px;margin-bottom:8px}
.pp-sub .pp-row{justify-content:center}
.pp-no{display:inline-block;margin-top:8px;font-size:12px;color:#999}
.pulse{animation:pulse 1.2s infinite;outline:3px solid #2f9e62;outline-offset:2px}
@keyframes pulse{50%{outline-color:transparent}}

/* 測驗（quiz 判定器）*/
.qz-opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.qz-opt{border:2px solid #c9cfdc;background:#fff;border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;font-weight:500}
.qz-opt:hover{border-color:var(--ac)}
.qz-opt.no{border-color:var(--red);background:var(--red-soft);color:#9b2c28}
.qz-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;border-radius:12px;background:#f1f4fa;margin-bottom:12px}
.qz-item{display:inline-block;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid #c9cfdc;font-weight:700;cursor:grab;user-select:none}
.qz-item.on{border-color:var(--ac);background:var(--ac-soft)}
.qz-item.ok{border-color:var(--green);background:var(--green-soft);cursor:default}
.qz-buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.qz-bucket{border:2.5px dashed #c9cfdc;border-radius:14px;padding:10px;min-height:110px;cursor:pointer;background:#fff}
.qz-bucket b{display:block;margin-bottom:6px}
.qz-in{display:flex;flex-wrap:wrap;gap:6px}

/* 地圖先修連線 */
.grid{position:relative;column-gap:34px}
.grid svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.grid svg.links path{fill:none;stroke:#b8c0d2;stroke-width:2.5;stroke-dasharray:6 5}
.grid svg.links path.done{stroke:var(--green);stroke-dasharray:none}
.card{z-index:1}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid #e3e6ee;border-top-color:#1a73e8;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>

<script>
/* ============================================================
   電腦急救站｜共用程式（地圖頁、關卡頁都用這一份）
   ------------------------------------------------------------
   window.SITE 由 build.py 注入：{config, levels:[...], base}
   紀錄：localStorage「skillQuest_年-班-座」＋ Firestore skillQuest/{年-班-座}
   ============================================================ */
(function(){
  var SITE = window.SITE, CFG = SITE.config, LEVELS = SITE.levels;
  var ID_KEY = 'wk_identity';
  function $(id){return document.getElementById(id);}
  function digits(s){return String(s||'').replace(/\D/g,'');}
  var Q = window.Quest = {levels: LEVELS, config: CFG};
  Q.byCode = {}; LEVELS.forEach(function(l){Q.byCode[l.code]=l;});

  /* ---------- 小工具 ---------- */
  var toastT;
  Q.toast = function(t){var e=$('toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on');},2400);};
  Q.icon = function(name,cls){return '<svg class="ico'+(cls?' '+cls:'')+'"><use href="#i-'+name+'"/></svg>';};
  Q.esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

  /* ---------- 身分（年級／班級／座號）---------- */
  Q.getId = function(){
    var s={};try{s=JSON.parse(localStorage.getItem(ID_KEY)||'{}')||{};}catch(e){}
    return {grade:+s.grade||0, className:+s.className||0, studentId:+s.studentId||0};
  };
  Q.idValid = function(i){i=i||Q.getId();return i.grade>=3&&i.grade<=6&&i.className>=1&&i.className<=20&&i.studentId>=1&&i.studentId<=40;};
  Q.docId = function(i){i=i||Q.getId();return i.grade+'-'+i.className+'-'+i.studentId;};
  function setId(i){try{localStorage.setItem(ID_KEY,JSON.stringify(i));}catch(e){}}

  /* ---------- 紀錄 ---------- */
  var PROG = {levels:{}, certs:{}};
  function lkey(){return 'skillQuest_'+Q.docId();}
  function readLocal(){try{var o=JSON.parse(localStorage.getItem(lkey())||'{}')||{};return {levels:o.levels||{},certs:o.certs||{}};}catch(e){return {levels:{},certs:{}};}}
  function writeLocal(){try{localStorage.setItem(lkey(),JSON.stringify(PROG));}catch(e){}}
  Q.progress = function(){return PROG;};
  Q.passed = function(code){return !!PROG.levels[code];};
  Q.status = function(code){
    if(Q.passed(code))return 'passed';
    var l=Q.byCode[code];
    return (l.prereq||[]).every(Q.passed)?'open':'locked';
  };

  /* ---------- 證書條件 ---------- */
  Q.certOpen = function(c){return LEVELS.length>=((c.rule||{}).minLevels||0);};
  Q.certMet = function(c){
    var r=c.rule||{}, lv=LEVELS;
    if(!Q.certOpen(c))return false;
    if(r.all&&!lv.every(function(l){return Q.passed(l.code);}))return false;
    if(r.core&&!lv.filter(function(l){return l.core;}).every(function(l){return Q.passed(l.code);}))return false;
    if(r.perCategory){
      var ok=CFG.categories.every(function(cat){
        var inCat=lv.filter(function(l){return l.category===cat.id;});
        if(!inCat.length)return true;
        var need=Math.min(r.perCategory,inCat.length);
        return inCat.filter(function(l){return Q.passed(l.code);}).length>=need;
      });
      if(!ok)return false;
    }
    return true;
  };
  function certCode(cid){
    var s=Q.docId()+'|'+cid+'|'+Date.now(), h=0;
    for(var k=0;k<s.length;k++){h=(h*31+s.charCodeAt(k))>>>0;}
    return cid+'-'+h.toString(36).toUpperCase().slice(-6);
  }
  // 條件達成就頒發；頒發後永久保留（之後新增關卡也不會收回）
  Q.awardCerts = function(){
    var fresh=[];
    CFG.certs.forEach(function(c){
      if(!PROG.certs[c.id]&&Q.certMet(c)){
        PROG.certs[c.id]={awardedAt:Date.now(),code:certCode(c.id),levelSnapshot:LEVELS.map(function(l){return l.code;})};
        fresh.push(c);
      }
    });
    return fresh;
  };

  /* ---------- Firebase ---------- */
  var db=null,auth=null;
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
  var fbReady=new Promise(function(resolve){
    if(!CFG.firebase||location.protocol==='file:'){resolve(false);return;}
    var base='https://www.gstatic.com/firebasejs/10.8.0/';
    loadScript(base+'firebase-app-compat.js')
      .then(function(){return loadScript(base+'firebase-auth-compat.js');})
      .then(function(){return loadScript(base+'firebase-firestore-compat.js');})
      .then(function(){if(!firebase.apps.length)firebase.initializeApp(CFG.firebase);db=firebase.firestore();auth=firebase.auth();resolve(true);})
      .catch(function(e){console.warn('Firebase 載入失敗，改成只存在這台電腦',e);resolve(false);});
  });
  Q.firebase = function(){return fbReady.then(function(ok){return ok?{db:db,auth:auth,coll:coll}:null;});};
  function ensureAuth(){return auth.currentUser?Promise.resolve(auth.currentUser):auth.signInAnonymously().then(function(c){return c.user;});}
  function coll(){return db.collection(CFG.collection||'skillQuest');}

  function stat(cls,t){var e=$('saveStat');if(!e)return;e.className='pill'+(cls?' '+cls:'');e.textContent=t;}

  // 雲端與本機合併：關卡取「最早過關」那筆；證書取最早頒發那筆
  function merge(a,b){
    Object.keys(b||{}).forEach(function(k){if(!a[k]||(b[k].passedAt||b[k].awardedAt||0)<(a[k].passedAt||a[k].awardedAt||0))a[k]=b[k];});
    return a;
  }

  var listeners=[];
  Q.onChange = function(fn){listeners.push(fn);fn();};
  function emit(){listeners.forEach(function(fn){try{fn();}catch(e){console.error(e);}});}

  var loadedFor='';
  Q.load = function(){
    if(!Q.idValid()){PROG={levels:{},certs:{}};stat('warn','先填年級、班級、座號');emit();return Promise.resolve();}
    var id=Q.docId();loadedFor=id;
    PROG=readLocal();
    // 之前就達成、但當時證書還沒開放的，進網站時補發
    var freshLocal=Q.awardCerts().length;if(freshLocal)writeLocal();
    emit();
    stat('','讀取中…');
    return fbReady.then(function(ok){
      if(!ok){stat('warn','紀錄存在這台電腦');return;}
      return ensureAuth().then(function(){return coll().doc(id).get();}).then(function(doc){
        if(loadedFor!==id)return;
        var c=doc.exists?doc.data():{};
        merge(PROG.levels,c.levels);merge(PROG.certs,c.certs);
        Q.awardCerts();
        writeLocal();emit();
        stat('ok','已連上雲端');
        // 本機有、雲端沒有的（例如之前離線過關）補上傳
        var needPush=Object.keys(PROG.levels).some(function(k){return !(c.levels||{})[k];})||Object.keys(PROG.certs).some(function(k){return !(c.certs||{})[k];});
        if(needPush)return push();
      });
    }).catch(function(e){console.warn('讀取失敗',e);stat('bad','雲端讀不到，先存在這台電腦');});
  };
  function push(){
    var i=Q.getId();
    return fbReady.then(function(ok){
      if(!ok){stat('warn','紀錄存在這台電腦');return false;}
      var payload={grade:i.grade,className:i.className,studentId:i.studentId,levels:PROG.levels,certs:PROG.certs,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
      return ensureAuth().then(function(){return coll().doc(Q.docId(i)).set(payload,{merge:true});})
        .then(function(){stat('ok','已存到雲端');return true;})
        .catch(function(e){console.warn('雲端存檔失敗',e);stat('bad','雲端沒存到，先存在這台電腦');return false;});
    });
  }

  // 過關：記錄＋檢查證書。回傳 {fresh:[新拿到的證書]}
  Q.recordPass = function(code,info){
    if(!Q.idValid())return Promise.resolve({fresh:[],noId:true});
    if(!PROG.levels[code])PROG.levels[code]={passedAt:Date.now(),tries:info.tries||1,seconds:Math.round(info.seconds||0)};
    var fresh=Q.awardCerts();
    writeLocal();emit();
    return push().then(function(){return {fresh:fresh};});
  };

  /* ---------- 身分欄位 ---------- */
  Q.initIdBar = function(){
    if(!$('idG'))return Q.load();
    var s=Q.getId();
    if(s.grade)$('idG').value=s.grade;if(s.className)$('idC').value=s.className;if(s.studentId)$('idS').value=s.studentId;
    var t;
    ['idG','idC','idS'].forEach(function(id){
      $(id).addEventListener('input',function(){
        var d=digits(this.value);if(d!==this.value)this.value=d;
        setId({grade:+$('idG').value||0,className:+$('idC').value||0,studentId:+$('idS').value||0});
        clearTimeout(t);t=setTimeout(Q.load,500);
      });
    });
    return Q.load();
  };
})();

/* ============================================================
   電腦急救站｜判定器（checker）
   ------------------------------------------------------------
   每個判定器：Checkers[名稱](el, params, ctx) → 回傳清除函式（可省略）
     el     ：放關卡畫面的容器
     params ：level.json 裡 practice／challenge 的 params
     ctx.mode     'practice'（有提示）或 'challenge'（沒有提示）
     ctx.pass()   全部完成
     ctx.miss(t)  做錯一次（會算進嘗試次數），t＝要給學生看的話
     ctx.hint(t)  單純提示，不算錯
   原則：一定要偵測「真的做了那個動作」，不能只按一個「我完成了」。
   ============================================================ */
(function(){
  var C = window.Checkers = {};
  var esc = function(s){return Quest.esc(s);};
  function norm(s){return String(s||'').replace(/\s+/g,'').replace(/[，。、！？：；「」（）,.!?:;()"']/g,'');}

  // 共用：任務清單（一次一個任務，做完打勾）
  function taskList(el,tasks){
    var box=document.createElement('div');
    box.innerHTML=tasks.map(function(t,k){return '<div class="task" data-k="'+k+'"><span class="dot">'+(k+1)+'</span><span>'+t+'</span></div>';}).join('');
    el.appendChild(box);
    var cur=0;
    function paint(){[].forEach.call(box.children,function(d,k){d.classList.toggle('done',k<cur);d.classList.toggle('now',k===cur);if(k<cur)d.querySelector('.dot').innerHTML=Quest.icon('check');});}
    paint();
    return {get cur(){return cur;}, next:function(){cur++;paint();return cur>=tasks.length;}};
  }

  /* ---------- selectText：選取文字（拖選、雙擊選詞、Ctrl+A 全選）----------
     params.passage：一段文字；params.tasks：[{kind:'range'|'word'|'all', target, say}]
       range：用滑鼠拖曳選到 target；word：雙擊選到 target（請用英文單字，中文雙擊斷詞不穩定）
       all  ：在下方的文字框裡按 Ctrl+A 全選 */
  C.selectText = function(el,p,ctx){
    var practice=ctx.mode==='practice';
    var html=esc(p.passage);
    if(practice)p.tasks.forEach(function(t){if(t.target&&t.kind!=='all')html=html.replace(esc(t.target),'<mark>'+esc(t.target)+'</mark>');});
    var tl=taskList(el,p.tasks.map(function(t){return t.say;}));
    var wrap=document.createElement('div');
    wrap.innerHTML='<div class="passage" data-ck="passage">'+html+'</div>'+
      (p.tasks.some(function(t){return t.kind==='all';})?'<label class="lbl">文字框</label><textarea class="field" data-ck="all" rows="4">'+esc(p.allText||p.passage)+'</textarea>':'');
    el.appendChild(wrap);
    var passage=wrap.querySelector('[data-ck=passage]'), ta=wrap.querySelector('[data-ck=all]');
    var lastDbl=0;
    passage.addEventListener('dblclick',function(){lastDbl=Date.now();setTimeout(check,30);});
    function check(){
      var t=p.tasks[tl.cur];if(!t)return;
      if(t.kind==='all'){
        if(ta&&document.activeElement===ta&&ta.selectionStart===0&&ta.selectionEnd===ta.value.length&&ta.value.length>0)ok();
        return;
      }
      var sel=window.getSelection();if(!sel||sel.isCollapsed)return;
      if(!passage.contains(sel.anchorNode))return;
      var got=sel.toString();
      if(norm(got)===norm(t.target)){
        if(t.kind==='word'&&Date.now()-lastDbl>800){ctx.hint('選對了！不過這一題要練「雙擊」：在單字上快速按兩下左鍵。');return;}
        ok();
      }else if(got.length>2&&t.kind==='range'){
        var g=norm(got),w=norm(t.target);
        ctx.miss(g.indexOf(w)>=0?'選太多了，再試一次：從第一個字按住，拖到最後一個字就放開。':
          w.indexOf(g)>=0?'還沒選完整，要從第一個字一路拖到最後一個字。':'選到別的字了，看清楚題目要選哪幾個字。');
      }
    }
    function ok(){ctx.hint('');if(tl.next())ctx.pass();}
    var onUp=function(){setTimeout(check,20);};
    passage.addEventListener('mouseup',onUp);
    if(ta){ta.addEventListener('keyup',onUp);ta.addEventListener('select',onUp);}
    if(practice)ctx.hint('看清楚有<b>點點底線</b>的地方，就是要選取的文字。');
  };

  /* ---------- copyPaste：複製 → 貼上 ----------
     params.passage：來源文字；params.tasks：[{target, label}]，每個任務一個文字框
     判定：要發生「複製」動作，而且文字框是用「貼上」放進去的，內容含 target */
  C.copyPaste = function(el,p,ctx){
    // params.cut：true＝剪下（來源變成可編輯的文字框，剪下後原處要消失）
    var practice=ctx.mode==='practice';
    var html=esc(p.passage);
    if(practice)p.tasks.forEach(function(t){html=html.replace(esc(t.target),'<mark>'+esc(t.target)+'</mark>');});
    var tl=taskList(el,p.tasks.map(function(t){return t.say||((p.cut?'剪下':'複製')+'「'+esc(t.target)+'」，貼到「'+esc(t.label)+'」');}));
    var wrap=document.createElement('div');
    wrap.innerHTML=(p.cut?'<label class="lbl">'+esc(p.srcLabel||'原本的文字')+'<textarea class="field" data-ck="src" rows="3" spellcheck="false" style="margin-top:6px"></textarea></label>':'<div class="passage">'+html+'</div>')+p.tasks.map(function(t,k){return '<label class="lbl">'+esc(t.label)+'<textarea class="field" data-ck="f'+k+'" rows="2" spellcheck="false" style="margin-top:6px"></textarea></label>';}).join('');
    el.appendChild(wrap);
    var copied=false, src=wrap.querySelector('[data-ck=src]'), cutDone=false;
    var onCopy=function(){copied=true;if(practice)ctx.hint('複製好了！現在點一下下面的框框，按 <kbd>Ctrl</kbd>＋<kbd>V</kbd> 貼上。');};
    if(src){
      src.value=p.passage;
      src.addEventListener('cut',function(){cutDone=true;if(practice)ctx.hint('剪下了！原本的字不見了，但電腦記住了。點下面的框框，按 <kbd>Ctrl</kbd>＋<kbd>V</kbd> 貼上。');});
      src.addEventListener('copy',function(e){e.stopPropagation();if(practice)ctx.hint('這是「複製」喔，原本的字還在。這一關要用 <kbd>Ctrl</kbd>＋<kbd>X</kbd> 剪下。');});
      if(practice)ctx.hint('把「'+esc(p.tasks[0].target)+'」選起來，按 <kbd>Ctrl</kbd>＋<kbd>X</kbd> 剪下。');
    }else document.addEventListener('copy',onCopy);
    p.tasks.forEach(function(t,k){
      var f=wrap.querySelector('[data-ck=f'+k+']'), pasted=false, tm=null;
      // 貼上會同時觸發 paste 和 input，合併成一次判定，避免錯一次算兩次
      function later(){clearTimeout(tm);tm=setTimeout(check,30);}
      f.addEventListener('paste',function(){pasted=true;later();});
      f.addEventListener('input',later);
      function check(){
        if(tl.cur!==k)return;
        var v=f.value;
        if(!v.trim())return;
        if(!pasted){ctx.miss('這一關要用「貼上」喔，不要自己打字。先清空框框，再用 <kbd>Ctrl</kbd>＋<kbd>V</kbd>。');f.value='';return;}
        if(norm(v).indexOf(norm(t.target))<0){ctx.miss('貼上的內容不對，檢查一下是不是複製到別的字了。清空框框後再試一次。');return;}
        if(src&&(!cutDone||norm(src.value).indexOf(norm(t.target))>=0)){ctx.miss('原本的地方還有這段字——這是「複製」不是「剪下」。清空下面的框框，按 <kbd>Ctrl</kbd>＋<kbd>Z</kbd> 或重來，改用 <kbd>Ctrl</kbd>＋<kbd>X</kbd>。');return;}
        ctx.hint('');f.readOnly=true;
        if(tl.next())ctx.pass();
        else{copied=false;var nx=wrap.querySelector('[data-ck=f'+(k+1)+']');if(nx)nx.scrollIntoView({block:'nearest'});}
      }
    });
    return function(){document.removeEventListener('copy',onCopy);};
  };

  /* ---------- plainPaste：純文字貼上（Ctrl+Shift+V）----------
     params.richHtml：有顏色粗體的來源；params.target：要貼的那段文字（純文字）
     params.docHtml ：文件原本的內容，用 <span class="slot">…</span> 標出要貼的位置
     判定：文件裡出現 target，而且沒有帶進任何格式（style、粗體、字型、顏色…） */
  C.plainPaste = function(el,p,ctx){
    var practice=ctx.mode==='practice';
    var tl=taskList(el,[p.say1||'把上面彩色那段文字選起來，按 <kbd>Ctrl</kbd>＋<kbd>C</kbd> 複製',p.say2||'點文件裡灰色的位置，用「純文字貼上」貼進去']);
    var wrap=document.createElement('div');
    wrap.innerHTML='<label class="lbl">網頁上的資料</label><div class="rich" data-ck="rich">'+p.richHtml+'</div>'+
      '<label class="lbl">我的文件</label><div class="docbar">文件　|　字型：預設　大小：16</div><div class="doc" data-ck="doc" contenteditable="true" spellcheck="false">'+p.docHtml+'</div>';
    el.appendChild(wrap);
    var doc=wrap.querySelector('[data-ck=doc]');
    [].forEach.call(doc.querySelectorAll('*'),function(n){n.setAttribute('data-keep','1');});
    var onCopy=function(){if(tl.cur===0){tl.next();if(practice)ctx.hint('現在點文件裡的灰色字，然後按 <kbd>Ctrl</kbd>＋<kbd>Shift</kbd>＋<kbd>V</kbd>（三個鍵一起按）。');}};
    document.addEventListener('copy',onCopy);
    // 點進文件時把灰色「貼在這裡」拿掉，游標放在那一段最後面（直接刪 span 的話，Chrome 會把灰色樣式留給接下來貼上的字）
    doc.addEventListener('focus',function(){
      var s=doc.querySelector('.slot');if(!s)return;
      var par=s.parentNode;par.removeChild(s);
      setTimeout(function(){var r=document.createRange();r.selectNodeContents(par);r.collapse(false);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);},0);
    });
    doc.addEventListener('paste',function(){setTimeout(check,30);});
    function styled(){
      var bad=false;
      [].forEach.call(doc.querySelectorAll('*'),function(n){
        if(n.hasAttribute('data-keep'))return;
        if(n.hasAttribute('style')||/^(B|STRONG|I|EM|U|FONT|H\d|SPAN|A|TABLE|IMG)$/.test(n.tagName))bad=true;
      });
      return bad;
    }
    function check(){
      if(norm(doc.textContent).indexOf(norm(p.target))<0){
        if(styled())ctx.miss('格式（顏色、粗體）也跟著貼過來了！先按 <kbd>Ctrl</kbd>＋<kbd>Z</kbd> 復原，再改用 <kbd>Ctrl</kbd>＋<kbd>Shift</kbd>＋<kbd>V</kbd>。');
        else ctx.miss('貼進來的內容不完整，按 <kbd>Ctrl</kbd>＋<kbd>Z</kbd> 復原，再把整段複製一次。');
        return;
      }
      if(styled()){ctx.miss('格式（顏色、粗體）也跟著貼過來了！先按 <kbd>Ctrl</kbd>＋<kbd>Z</kbd> 復原，再改用 <kbd>Ctrl</kbd>＋<kbd>Shift</kbd>＋<kbd>V</kbd>。');return;}
      ctx.hint('');
      if(tl.cur===0)tl.next();
      if(tl.next()){doc.contentEditable='false';ctx.pass();}
    }
    return function(){document.removeEventListener('copy',onCopy);};
  };

  /* ---------- fileUpload：做完 → 把檔案上傳回來比對 ----------
     網頁看不到檔案總管，所以「下載、改名、另存」都用上傳回來的檔案判定。
     params.file：
       文字檔 {name, lines:[…]}：按鈕下載，內容自動加一行驗證碼（每次進關卡都不同，舊檔案過不了）
       圖片   {src, name, alt}：顯示圖片讓學生「另存圖片」，用 SHA-256 比對是不是同一張
     params.rename：要改成的檔名，可用 {grade}{class}{seat}（會比對時忽略前導 0、全形數字、空白）
     params.say：[第一步說明, 第二步說明]（可省略） */
  C.fileUpload = function(el,p,ctx){
    var practice=ctx.mode==='practice', F=p.file||{}, isImg=!!F.src;
    var code=Math.random().toString(36).slice(2,6).toUpperCase();
    var say=p.say||[
      isImg?'在圖片上按<b>右鍵</b> →「另存圖片」，存到電腦裡':'按「下載」，把 <b>'+esc(F.name)+'</b> 存到電腦',
      p.rename?'到檔案總管把檔名改成 <b>'+esc(fill(p.rename))+'</b>，再上傳':'按「選擇檔案」，找到剛剛的檔案上傳'];
    var tl=taskList(el,say);
    var wrap=document.createElement('div');
    wrap.innerHTML=(isImg?'<div class="rich" style="text-align:center"><img data-ck="img" src="'+esc(F.src)+'" alt="'+esc(F.alt||'')+'" style="margin:0 auto;max-height:320px"></div>':
        '<button class="go" data-ck="dl" type="button">下載 '+esc(F.name)+'</button>')+
      '<label class="drop" data-ck="drop"><input type="file" data-ck="file" hidden><b>選擇檔案</b>　或把檔案拖到這裡</label>';
    el.appendChild(wrap);
    var drop=wrap.querySelector('[data-ck=drop]'), inp=wrap.querySelector('[data-ck=file]');
    var origHash=null;
    if(isImg){
      fetch(F.src).then(function(r){return r.arrayBuffer();}).then(sha).then(function(h){origHash=h;});
      wrap.querySelector('[data-ck=img]').addEventListener('contextmenu',function(){
        if(tl.cur===0){tl.next();if(practice)ctx.hint('選「另存圖片」，記住存到哪個資料夾（通常是「下載」）。存好後按下面的「選擇檔案」把它找出來。');}
      });
    }else{
      wrap.querySelector('[data-ck=dl]').addEventListener('click',function(){
        var text='﻿'+(F.lines||[]).join('\r\n')+'\r\n驗證碼：'+code+'\r\n';
        var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=F.name;
        document.body.appendChild(a);a.click();a.remove();
        if(tl.cur===0)tl.next();
        if(practice)ctx.hint(p.rename?'下載好了！打開檔案總管 →「下載」資料夾，在檔案上按右鍵 →「重新命名」（或選取後按 <kbd>F2</kbd>）。':
          '下載好了！按下面的「選擇檔案」，在左邊點「下載」，選 <b>'+esc(F.name)+'</b> →「開啟」。');
      });
    }
    inp.addEventListener('change',function(){if(inp.files[0])check(inp.files[0]);inp.value='';});
    drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('on');});
    drop.addEventListener('dragleave',function(){drop.classList.remove('on');});
    drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('on');var f=e.dataTransfer.files[0];if(f)check(f);});

    function fill(s){var i=Quest.getId();return s.replace('{grade}',i.grade||'?').replace('{class}',i.className||'?').replace('{seat}',i.studentId||'?');}
    function nname(s){return String(s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/\s+/g,'').replace(/\d+/g,function(d){return String(+d);}).toLowerCase();}
    function sha(buf){return crypto.subtle.digest('SHA-256',buf).then(function(h){return Array.prototype.map.call(new Uint8Array(h),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');});}
    function base(n){return n.replace(/ ?\(\d+\)(?=\.[^.]+$)/,'');}   // 「任務卡 (1).txt」→「任務卡.txt」

    function check(f){
      if(p.rename&&!Quest.idValid()){ctx.hint('先在右上角填好年級、班級、座號，才知道檔名要改成什麼。');return;}
      if(isImg){
        if(!/^image\//.test(f.type)){ctx.miss('這不是圖片檔，要上傳剛剛另存的那張圖片。');return;}
        f.arrayBuffer().then(sha).then(function(h){
          if(origHash&&h!==origHash){ctx.miss('這張圖片和上面的不一樣。要用「另存圖片」存下來，不要用截圖。');return;}
          done();
        });
        return;
      }
      if(p.rename){
        var want=nname(fill(p.rename)), got=nname(f.name), ext=(want.match(/\.[^.]+$/)||[''])[0];
        if(got!==want){
          if(got===want+ext)return ctx.miss('檔名變成「'+esc(f.name)+'」，多了一個 '+ext+'。副檔名本來就有了，只要改前面的名字。');
          if(got===want.slice(0,-ext.length))return ctx.miss('副檔名 '+ext+' 不見了！改名時只改前面，後面的 '+ext+' 要留著。');
          if(nname(base(f.name))===nname(F.name))return ctx.miss('這個檔案還沒改名喔。到檔案總管把它改成 <b>'+esc(fill(p.rename))+'</b> 再上傳。');
          return ctx.miss('檔名是「'+esc(f.name)+'」，和題目要的 <b>'+esc(fill(p.rename))+'</b> 不一樣，仔細看每個字。');
        }
      }else if(nname(base(f.name))!==nname(F.name)){
        return ctx.miss('上傳的是「'+esc(f.name)+'」，要找的是剛剛下載的 <b>'+esc(F.name)+'</b>。');
      }
      f.text().then(function(t){
        if(t.indexOf('驗證碼：'+code)<0)return ctx.miss('這是之前下載的舊檔案。請上傳<b>剛剛</b>下載的那一個（檔名後面可能多了 (1)、(2)）。');
        done();
      });
    }
    function done(){ctx.hint('');while(tl.cur<say.length-1)tl.next();tl.next();drop.style.pointerEvents='none';ctx.pass();}
  };

  /* ---------- popup：處理彈出視窗（網頁內模擬）----------
     params.popups：依序出現的視窗種類 cookie／notify／ad／prize／subscribe
     params.shuffle：true＝打亂順序；params.adWait：廣告的 × 要等幾秒才出現（0＝馬上）
     params.page：{tab, url, html} 底下那個網頁的樣子
     按到陷阱按鈕＝miss（說明為什麼不能按），視窗留著；按對才關掉、換下一個 */
  var POPS={
    cookie:{name:'Cookie 同意視窗',hint:'這是 Cookie 同意視窗。網站想記錄你看了什麼。選<b>「只接受必要的」</b>最安全。',
      html:function(){return '<div class="pp pp-cookie"><b>這個網站使用 Cookie</b><p>我們和合作夥伴會使用 Cookie 來提供個人化廣告與分析。</p><div class="pp-row"><button data-bad="全部接受">全部接受</button><button data-ok class="pp-plain">只接受必要的</button></div></div>';},
      bad:{'全部接受':'「全部接受」會讓網站和廣告商記錄你看了什麼。選「只接受必要的」比較保護自己。'}},
    notify:{name:'通知權限',hint:'網址列下面跳出「想要顯示通知」。不認識的網站一律按<b>「封鎖」</b>。',
      html:function(o){return '<div class="pp pp-notify"><b>'+esc(o.host)+' 想要</b><p>顯示通知</p><div class="pp-row"><button data-bad="允許">允許</button><button data-ok class="pp-plain">封鎖</button></div></div>';},
      bad:{'允許':'按了「允許」，這個網站以後可以一直跳通知給你，很多是廣告或詐騙。不認識的網站按「封鎖」。'}},
    ad:{name:'廣告視窗',hint:'這是廣告。大大的按鈕是陷阱，要找<b>角落的小 ×</b>（有時要等幾秒才出現）。',
      html:function(o){var left=o.shuffle&&Math.random()<.5;return '<div class="pp-mask"><div class="pp pp-ad"><span class="pp-x'+(left?' l':'')+'" data-ok'+(o.adWait?' hidden':'')+' title="關閉">×</span>'+(o.adWait?'<span class="pp-wait">'+o.adWait+' 秒後可關閉</span>':'')+'<div class="pp-adart">超好玩手機遊戲<br><small>限時免費</small></div><button data-bad="下載" class="pp-big">立即免費下載</button><button data-bad="關閉廣告" class="pp-fake">關閉廣告</button></div></div>';},
      bad:{'下載':'這是廣告按鈕！按了會跑到別的網站，甚至下載奇怪的程式。要找角落的小 ×。','關閉廣告':'小心！這個「關閉廣告」是廣告的一部分，按了一樣會跳到廣告網站。真正的關閉是角落的小 ×。'}},
    prize:{name:'假中獎視窗',hint:'「恭喜中獎」幾乎都是詐騙。不要領獎，按<b>「關閉」</b>。',
      html:function(){return '<div class="pp-mask"><div class="pp pp-prize"><div class="pp-trophy">恭喜你！</div><p>你是今天第 <b>1,000,000</b> 位訪客，獲得最新平板電腦一台！</p><p class="pp-red">只剩 59 秒，快領取！</p><div class="pp-row"><button data-bad="領獎" class="pp-big">立即領獎</button><button data-ok class="pp-plain">關閉</button></div></div></div>';},
      bad:{'領獎':'天下沒有白吃的午餐！「中獎」視窗是詐騙，按了會要你填個資、手機號碼或付錢。'}},
    subscribe:{name:'訂閱視窗',hint:'不需要的東西<b>不要留 Email</b>。點小小的<b>「不用了，謝謝」</b>。',
      html:function(){return '<div class="pp-mask"><div class="pp pp-sub"><b>訂閱我們的電子報！</b><p>輸入 Email 就送你 100 元折價券</p><input data-bad-input placeholder="你的 Email" aria-label="Email"><div class="pp-row"><button data-bad="訂閱" class="pp-big">訂閱</button></div><a href="#" data-ok class="pp-no">不用了，謝謝</a></div></div>';},
      bad:{'訂閱':'不需要的東西不要留 Email 或個資，留了之後會收到一堆廣告信。點「不用了，謝謝」就好。'}}
  };
  C.popup = function(el,p,ctx){
    var practice=ctx.mode==='practice', list=(p.popups||[]).slice();
    if(p.shuffle)list.sort(function(){return Math.random()-.5;});
    var pg=p.page||{};
    var tl=taskList(el,list.map(function(k,n){return practice?'關掉「'+POPS[k].name+'」':'安全地處理第 '+(n+1)+' 個跳出來的視窗';}));
    var wrap=document.createElement('div');
    wrap.innerHTML='<div class="fb"><div class="fb-tabs"><span class="fb-tab">'+esc(pg.tab||'小學生線上字典')+'</span></div><div class="fb-url">'+esc(pg.url||'dict.example.tw')+'</div><div class="fb-page">'+(pg.html||'<h3>小學生線上字典</h3><p>搜尋：<b>電腦</b></p><p>英文：computer</p>')+'</div><div class="fb-layer"></div></div>';
    el.appendChild(wrap);
    var layer=wrap.querySelector('.fb-layer'), i=0, timer=null;
    function showNext(){
      layer.innerHTML='';
      if(i>=list.length){ctx.hint('');ctx.pass();return;}
      var k=list[i], P=POPS[k];
      layer.innerHTML=P.html({host:pg.url||'dict.example.tw',shuffle:p.shuffle,adWait:p.adWait||0});
      if(practice){ctx.hint(P.hint);var ok=layer.querySelector('[data-ok]');if(ok)ok.classList.add('pulse');}
      var x=layer.querySelector('.pp-x[hidden]');
      if(x){var n=p.adWait,w=layer.querySelector('.pp-wait');timer=setInterval(function(){n--;if(n>0){w.textContent=n+' 秒後可關閉';}else{clearInterval(timer);w.remove();x.hidden=false;}},1000);}
    }
    layer.addEventListener('click',function(e){
      var t=e.target.closest('[data-ok],[data-bad]');if(!t)return;
      e.preventDefault();
      if(t.hasAttribute('data-ok')){clearInterval(timer);i++;tl.next();ctx.hint('');setTimeout(showNext,500);layer.innerHTML='';return;}
      ctx.miss(POPS[list[i]].bad[t.getAttribute('data-bad')]||'這個按鈕不對喔。');
    });
    layer.addEventListener('focusin',function(e){if(e.target.hasAttribute('data-bad-input'))ctx.hint('先停一下！不需要的東西，不要在跳出來的視窗裡填 Email 或個資。');});
    setTimeout(showNext,600);
    return function(){clearInterval(timer);};
  };

  /* ---------- tabPair：開新分頁 → 切過去看密碼 → 切回來輸入 → 關掉多的分頁 ----------
     搭配 site/tab/（密碼小卡），用 BroadcastChannel 溝通。
     params.linkText：連結文字；params.closeTab：true＝最後要把密碼小卡分頁關掉 */
  C.tabPair = function(el,p,ctx){
    var practice=ctx.mode==='practice';
    var sid=ctx.mode+Math.random().toString(36).slice(2,8), code=String(1000+Math.floor(Math.random()*9000));
    var steps=['按住 <kbd>Ctrl</kbd> 點下面的連結，讓它在<b>新分頁</b>打開','切換到新分頁，看密碼是多少','切回這個分頁，把密碼打進框框'];
    if(p.closeTab)steps.push('把「密碼小卡」那個分頁關掉（<kbd>Ctrl</kbd>＋<kbd>W</kbd> 或分頁上的 ×）');
    var tl=taskList(el,steps);
    var wrap=document.createElement('div');
    wrap.innerHTML='<div class="passage"><a href="../tab/#'+sid+'" target="_blank" rel="opener" data-ck="link" style="font-weight:700;color:var(--ac)">'+esc(p.linkText||'打開密碼小卡')+'</a></div>'+
      '<label class="lbl">密碼<input class="field" data-ck="code" inputmode="numeric" maxlength="4" style="min-height:0;max-width:180px;margin-top:6px;font-size:22px;letter-spacing:6px" disabled></label>';
    el.appendChild(wrap);
    var link=wrap.querySelector('[data-ck=link]'), inp=wrap.querySelector('[data-ck=code]');
    link.addEventListener('click',function(e){
      if(e.ctrlKey||e.metaKey||e.shiftKey)return;
      e.preventDefault();
      ctx.miss('直接點會蓋掉這一頁！要<b>按住 <kbd>Ctrl</kbd> 不放</b>再點連結（或按右鍵 →「在新分頁中開啟連結」）。');
    });
    if(!window.BroadcastChannel){ctx.hint('這個瀏覽器太舊，請改用 Chrome。');return;}
    var ch=new BroadcastChannel('skillquest-tab'), seen=false, typed=false, lastPong=0, poll=null;
    // 分頁被關掉時 pagehide 的 bye 不一定送得出來，所以輸入密碼後改成每秒 ping，連續 2.5 秒沒回應就當作關掉了
    function closed(){clearInterval(poll);if(tl.cur===3){tl.next();ctx.hint('');ctx.pass();}}
    function startPoll(){lastPong=Date.now();poll=setInterval(function(){ch.postMessage({sid:sid,type:'ping'});if(Date.now()-lastPong>2500)closed();},1000);}
    ch.onmessage=function(e){
      var d=e.data||{};if(d.sid!==sid)return;
      if(d.type==='pong'){lastPong=Date.now();return;}
      if(d.type==='hello'){
        ch.postMessage({sid:sid,type:'code',code:code});
        if(tl.cur===0){tl.next();if(practice)ctx.hint('新分頁開好了，在最上面。點它，或按 <kbd>Ctrl</kbd>＋<kbd>Tab</kbd> 切過去。');}
      }else if(d.type==='seen'&&!seen){
        seen=true;while(tl.cur<2)tl.next();inp.disabled=false;
        if(practice)ctx.hint('看到密碼了吧？切回這個分頁（點分頁或 <kbd>Ctrl</kbd>＋<kbd>Tab</kbd>），把密碼打進框框。');
      }else if(d.type==='bye'&&p.closeTab){
        if(!typed){ctx.miss('密碼還沒輸入，就把密碼小卡關掉了。按住 <kbd>Ctrl</kbd> 再點一次連結重新打開。');seen=false;inp.disabled=true;return;}
        closed();
      }
    };
    inp.addEventListener('input',function(){
      var v=inp.value.replace(/\D/g,'');if(v!==inp.value)inp.value=v;
      if(v.length<4)return;
      if(v!==code){ctx.miss('密碼不對，再切過去看一次。');return;}
      typed=true;inp.disabled=true;tl.next();
      if(!p.closeTab){ctx.hint('');ctx.pass();}
      else{startPoll();if(practice)ctx.hint('答對了！最後把「密碼小卡」分頁關掉：切過去按 <kbd>Ctrl</kbd>＋<kbd>W</kbd>，或按分頁上的 ×。');}
    });
    return function(){clearInterval(poll);ch.close();};
  };

  /* ---------- keyTask：在文字框裡依序完成任務，可指定要用哪個快速鍵 ----------
     params.text：文字框一開始的內容；params.tasks：[{say, key, cond, hint}]
       key ：必須用這個快速鍵完成（例 'ctrl+z'；可用 | 分隔多個 'ctrl+y|ctrl+shift+z'）
       cond：{equals:'@original'|文字, contains, notContains, caps:true}——文字框內容要符合
     條件達成但沒按指定快速鍵（例如自己重打）→ miss */
  // 鍵盤事件 → 'ctrl+shift+z' 這種字串（單獨按 Shift 打字不算組合鍵）
  function comboOf(e){
    var mod=e.ctrlKey||e.metaKey, parts=[];
    if(mod)parts.push('ctrl');
    if(e.shiftKey&&(mod||e.altKey||e.key.length>1))parts.push('shift');
    if(e.altKey)parts.push('alt');
    parts.push(e.key.toLowerCase());
    return parts.join('+');
  }
  function keyLabel(c){return c.split('+').map(function(k){return '<kbd>'+(k.length===1?k.toUpperCase():k.charAt(0).toUpperCase()+k.slice(1))+'</kbd>';}).join('＋');}
  C.keyTask = function(el,p,ctx){
    var practice=ctx.mode==='practice', T=p.tasks;
    var tl=taskList(el,T.map(function(t){return t.say;}));
    var wrap=document.createElement('div');
    wrap.innerHTML='<textarea class="field" data-ck="ta" rows="4" spellcheck="false"></textarea>';
    el.appendChild(wrap);
    var ta=wrap.querySelector('[data-ck=ta]'); ta.value=p.text||'';
    var lastCombo='', lastAt=0;
    function met(c){
      var v=ta.value;
      if(c.equals!=null&&v!==(c.equals==='@original'?p.text:c.equals))return false;
      if(c.contains!=null&&v.indexOf(c.contains)<0)return false;
      if(c.notContains!=null&&v.indexOf(c.notContains)>=0)return false;
      return true;
    }
    function check(){
      var t=T[tl.cur];if(!t)return;
      if(!met(t.cond||{}))return;
      if(t.key){
        var ok=t.key.split('|').indexOf(lastCombo)>=0&&Date.now()-lastAt<1500;
        if(!ok){ctx.miss(t.miss||('這一步要用 '+keyLabel(t.key.split('|')[0])+' 完成，不要自己重打。'));return;}
      }
      ctx.hint('');
      if(tl.next()){ta.readOnly=true;ctx.pass();}
      else if(practice&&T[tl.cur].hint)ctx.hint(T[tl.cur].hint);
    }
    ta.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey||e.key.length>1){lastCombo=comboOf(e);lastAt=Date.now();}});
    ta.addEventListener('input',function(){setTimeout(check,10);});
    ta.addEventListener('keyup',function(){setTimeout(check,10);});
    if(practice&&T[0].hint)ctx.hint(T[0].hint);
  };

  /* ---------- quiz：選擇題或分類題（不計分數，全部答對才過關）----------
     params.kind：'choice'——questions:[{q, options:[…], answer:索引, why}]
                  'bucket'——buckets:[名稱…]、items:[{t, b:桶子索引, why}]；拖曳或「先點項目再點桶子」 */
  C.quiz = function(el,p,ctx){
    var practice=ctx.mode==='practice';
    var wrap=document.createElement('div');el.appendChild(wrap);
    if(p.kind==='bucket'){
      var left=p.items.length;
      wrap.innerHTML='<div class="qz-pool" data-ck="pool">'+p.items.map(function(it,k){return '<span class="qz-item" draggable="true" data-k="'+k+'">'+esc(it.t)+'</span>';}).join('')+'</div>'+
        '<div class="qz-buckets">'+p.buckets.map(function(b,k){return '<div class="qz-bucket" data-b="'+k+'"><b>'+esc(b)+'</b><div class="qz-in"></div></div>';}).join('')+'</div>';
      var pick=null;
      function sel(it){[].forEach.call(wrap.querySelectorAll('.qz-item'),function(x){x.classList.toggle('on',x===it);});pick=it;}
      function put(it,bk){
        var I=p.items[+it.dataset.k];
        if(I.b!==+bk.dataset.b){ctx.miss('「'+esc(I.t)+'」不是放這裡喔。'+(practice&&I.why?esc(I.why):''));sel(null);return;}
        bk.querySelector('.qz-in').appendChild(it);it.draggable=false;it.classList.remove('on');it.classList.add('ok');pick=null;ctx.hint(practice&&I.why?'答對了！'+esc(I.why):'');
        if(--left===0)ctx.pass();
      }
      wrap.addEventListener('click',function(e){
        var it=e.target.closest('.qz-item:not(.ok)');if(it){sel(it);return;}
        var bk=e.target.closest('.qz-bucket');if(bk&&pick)put(pick,bk);
      });
      wrap.addEventListener('dragstart',function(e){var it=e.target.closest('.qz-item');if(it){sel(it);e.dataTransfer.setData('text/plain',it.dataset.k);}});
      wrap.addEventListener('dragover',function(e){if(e.target.closest('.qz-bucket'))e.preventDefault();});
      wrap.addEventListener('drop',function(e){var bk=e.target.closest('.qz-bucket');if(bk&&pick){e.preventDefault();put(pick,bk);}});
      if(practice)ctx.hint('把上面的每一個拖到正確的框框裡（也可以先點一下，再點框框）。');
      return;
    }
    var Qs=p.questions, i=0;
    function show(){
      if(i>=Qs.length){ctx.hint('');ctx.pass();return;}
      var q=Qs[i];
      wrap.innerHTML='<div class="task now"><span class="dot">'+(i+1)+'</span><span>'+q.q+'</span></div><div class="qz-opts">'+q.options.map(function(o,k){return '<button class="qz-opt" data-k="'+k+'">'+o+'</button>';}).join('')+'</div>';
    }
    wrap.addEventListener('click',function(e){
      var b=e.target.closest('.qz-opt');if(!b)return;
      var q=Qs[i];
      if(+b.dataset.k!==q.answer){b.classList.add('no');ctx.miss(q.wrong||'再想想看。');return;}
      ctx.hint(practice&&q.why?'答對了！'+q.why:'');i++;setTimeout(show,practice&&q.why?1400:300);
    });
    show();
  };

  /* ---------- tabUrl：開新分頁 → 複製網址列的網址 → 切回來貼上 ----------
     搭配 site/tab/（mode:url）。網址裡有這次專用的 #代碼，所以只有複製那個分頁的網址才會對。 */
  C.tabUrl = function(el,p,ctx){
    var practice=ctx.mode==='practice', sid='u'+ctx.mode+Math.random().toString(36).slice(2,8);
    var tl=taskList(el,['按住 <kbd>Ctrl</kbd> 點下面的連結，在新分頁打開','到新分頁，點網址列，按 <kbd>Ctrl</kbd>＋<kbd>C</kbd> 複製網址','切回這裡，把網址貼到框框']);
    var wrap=document.createElement('div');
    wrap.innerHTML='<div class="passage"><a href="../tab/#'+sid+'" target="_blank" data-ck="link" style="font-weight:700;color:var(--ac)">'+esc(p.linkText||'打開要複製網址的網頁')+'</a></div>'+
      '<label class="lbl">網址<textarea class="field" data-ck="url" rows="2" spellcheck="false" style="margin-top:6px"></textarea></label>';
    el.appendChild(wrap);
    var link=wrap.querySelector('[data-ck=link]'), f=wrap.querySelector('[data-ck=url]'), pasted=false;
    link.addEventListener('click',function(e){if(e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();ctx.miss('要<b>按住 <kbd>Ctrl</kbd></b> 再點連結，讓它在新分頁打開。');});
    if(!window.BroadcastChannel){ctx.hint('這個瀏覽器太舊，請改用 Chrome。');return;}
    var ch=new BroadcastChannel('skillquest-tab');
    ch.onmessage=function(e){var d=e.data||{};if(d.sid!==sid)return;
      if(d.type==='hello'){ch.postMessage({sid:sid,type:'code',mode:'url'});if(tl.cur===0){tl.next();if(practice)ctx.hint('打開了！切到新分頁，照上面的說明複製網址。');}}
      else if(d.type==='seen'&&tl.cur===1&&practice)ctx.hint('點一下網址列，網址會整個變藍，這時按 <kbd>Ctrl</kbd>＋<kbd>C</kbd>。');};
    var tm=null;function later(){clearTimeout(tm);tm=setTimeout(check,30);}
    f.addEventListener('paste',function(){pasted=true;later();});
    f.addEventListener('input',later);
    function clean(u){try{u=decodeURI(u);}catch(x){}return u.trim().replace(/^https?:\/\//,'').replace(/\/$/,'');}
    function check(){
      var v=f.value.trim();if(!v)return;
      if(!pasted){ctx.miss('網址要用複製貼上，不要自己打（很容易打錯）。清空框框再試一次。');f.value='';return;}
      if(clean(v)!==clean(link.href)){ctx.miss(v.indexOf('#'+sid)<0?'這不是那個分頁的網址。到新打開的分頁，點網址列再複製一次。':'網址不完整，點一下網址列讓它整個變藍，再複製。');pasted=false;return;}
      while(tl.cur<3)tl.next();f.readOnly=true;ctx.hint('');ctx.pass();
    }
    return function(){ch.close();};
  };

  /* ---------- tabReopen：開分頁 → 關掉 → 用 Ctrl+Shift+T 救回來 ---------- */
  C.tabReopen = function(el,p,ctx){
    var practice=ctx.mode==='practice', sid='r'+ctx.mode+Math.random().toString(36).slice(2,8);
    var tl=taskList(el,['按住 <kbd>Ctrl</kbd> 點下面的連結，在新分頁打開','切到那個分頁，把它關掉（<kbd>Ctrl</kbd>＋<kbd>W</kbd>）','糟糕關錯了！按 <kbd>Ctrl</kbd>＋<kbd>Shift</kbd>＋<kbd>T</kbd> 把它救回來']);
    var wrap=document.createElement('div');
    wrap.innerHTML='<div class="passage"><a href="../tab/#'+sid+'" target="_blank" data-ck="link" style="font-weight:700;color:var(--ac)">'+esc(p.linkText||'打開練習用的分頁')+'</a></div>';
    el.appendChild(wrap);
    wrap.querySelector('[data-ck=link]').addEventListener('click',function(e){if(e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();ctx.miss('要<b>按住 <kbd>Ctrl</kbd></b> 再點連結。');});
    if(!window.BroadcastChannel){ctx.hint('這個瀏覽器太舊，請改用 Chrome。');return;}
    var ch=new BroadcastChannel('skillquest-tab'), lastPong=0, poll=null;
    function closed(){clearInterval(poll);poll=null;if(tl.cur===1){tl.next();if(practice)ctx.hint('關掉了。現在按 <kbd>Ctrl</kbd>＋<kbd>Shift</kbd>＋<kbd>T</kbd>（三個鍵一起按），剛剛關掉的分頁會回來。');}}
    ch.onmessage=function(e){var d=e.data||{};if(d.sid!==sid)return;
      if(d.type==='pong'){lastPong=Date.now();return;}
      if(d.type==='hello'){
        if(tl.cur===2){ch.postMessage({sid:sid,type:'code',mode:'back'});tl.next();ctx.hint('');ctx.pass();return;}
        ch.postMessage({sid:sid,type:'code',mode:'close'});
        lastPong=Date.now();
        if(!poll)poll=setInterval(function(){ch.postMessage({sid:sid,type:'ping'});if(Date.now()-lastPong>2500)closed();},1000);
        if(tl.cur===0){tl.next();if(practice)ctx.hint('打開了！切到那個分頁，按 <kbd>Ctrl</kbd>＋<kbd>W</kbd> 把它關掉。');}
      }else if(d.type==='bye')closed();
    };
    return function(){clearInterval(poll);ch.close();};
  };

  /* ---------- reload：網頁卡住了 → 按 F5（或重新整理鈕）----------
     進關卡時在 sessionStorage 記一筆；重新整理後同一個分頁回來、而且是 reload，就算過關。 */
  C.reload = function(el,p,ctx){
    var key='sq-reload-'+ctx.mode, t0=0;
    try{t0=+sessionStorage.getItem(key)||0;}catch(e){}
    var nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{};
    var tl=taskList(el,[p.say||'這個網頁卡住了，一直轉圈圈。用<b>重新整理</b>讓它重新載入']);
    if(t0&&Date.now()-t0<10*60*1000&&nav.type==='reload'){
      try{sessionStorage.removeItem(key);}catch(e){}
      el.insertAdjacentHTML('beforeend','<div class="passage" style="text-align:center"><b style="color:var(--green)">重新整理成功，網頁正常了！</b></div>');
      tl.next();setTimeout(ctx.pass,400);return;
    }
    try{sessionStorage.setItem(key,String(Date.now()));}catch(e){}
    el.insertAdjacentHTML('beforeend','<div class="fb"><div class="fb-tabs"><span class="fb-tab">'+esc(p.tab||'載入中…')+'</span></div><div class="fb-url">'+esc(p.url||'school.example.tw')+'</div><div class="fb-page" style="display:grid;place-items:center;min-height:240px"><div class="spin"></div><p style="color:#888">載入中，請稍候……</p></div></div>');
    if(ctx.mode==='practice')ctx.hint('按鍵盤最上面一排的 <kbd>F5</kbd>，或按網址列左邊的「↻」重新整理按鈕。');
  };
})();

</script>

<script>
(function(){
  var Q=Quest, LV=window.SITE.level;
  function $(id){return document.getElementById(id);}

  /* ---------- 看 ---------- */
  var L=LV.learn||{};
  $('learnBox').innerHTML=
    (L.video?'<div class="vid"><video controls playsinline preload="metadata" src="'+L.video+'"'+(L.poster?' poster="'+L.poster+'"':'')+'></video></div>':
      '<div class="novid">'+Q.icon('play')+'教學影片製作中，先看下面的步驟。</div>')+
    '<h2 style="margin-top:18px">步驟</h2><ol class="steps">'+(L.steps||[]).map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+
    (L.tips||[]).map(function(t){return '<div class="tip">'+Q.icon('bulb')+'<div>'+t+'</div></div>';}).join('')+
    '<div class="actions"><button class="go" data-goto="practice">去練習</button><button class="go ghost" data-goto="challenge">我會了，直接挑戰</button></div>';

  /* ---------- 分頁 ---------- */
  var tabs=[].slice.call(document.querySelectorAll('.tabs button'));
  function show(t){
    tabs.forEach(function(b){b.classList.toggle('on',b.dataset.t===t);});
    ['learn','practice','challenge'].forEach(function(k){$('p-'+k).classList.toggle('on',k===t);});
    if(t!=='learn')mount(t);
    var v=document.querySelector('video');if(v&&t!=='learn')v.pause();
    try{history.replaceState(null,'','#'+t);}catch(e){}
    window.scrollTo(0,0);
  }
  tabs.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.t);});});
  document.addEventListener('click',function(e){
    var g=e.target.closest('[data-goto]');if(g){closePass();show(g.dataset.goto);}
    var r=e.target.closest('[data-retry]');if(r)mount(r.dataset.retry,true);
  });

  /* ---------- 判定器掛載 ---------- */
  var mounted={},cleanup={},tries=0,t0=0;
  function mount(mode,force){
    if(mounted[mode]&&!force)return;
    var el=$(mode==='practice'?'ckPractice':'ckChallenge'), hint=$(mode==='practice'?'hintPractice':'hintChallenge');
    if(cleanup[mode]){try{cleanup[mode]();}catch(e){}}
    el.innerHTML='';hint.className='hint';hint.innerHTML='';
    var spec=LV[mode];
    if(mode==='challenge'){tries=1;t0=Date.now();}
    var ctx={mode:mode,
      hint:function(t){hint.className='hint'+(t?' on info':'');hint.innerHTML=t||'';},
      miss:function(t){if(mode==='challenge')tries++;hint.className='hint on bad';hint.innerHTML=t;},
      pass:function(){done(mode);}};
    var fn=window.Checkers[spec.checker];
    if(!fn){el.innerHTML='<p>找不到判定器：'+spec.checker+'</p>';return;}
    cleanup[mode]=fn(el,JSON.parse(JSON.stringify(spec.params||{})),ctx);
    mounted[mode]=true;
  }

  /* ---------- 過關 ---------- */
  function closePass(){$('passBox').classList.remove('on');}
  function nextLevel(){
    var open=Q.levels.filter(function(l){return Q.status(l.code)==='open';});
    var same=open.filter(function(l){return l.category===LV.category;});
    return same[0]||open[0];
  }
  function done(mode){
    var card=$('passCard');
    if(mode==='practice'){
      tabs[1].classList.add('done');
      card.innerHTML='<div class="medal">'+Q.icon('star','')+'</div><h2>練習完成！</h2><p>很好！現在不看提示，自己做一次。</p><div class="actions"><button class="go" data-goto="challenge">去挑戰</button></div>';
      $('passBox').classList.add('on');return;
    }
    var secs=(Date.now()-t0)/1000;
    Q.recordPass(LV.code,{tries:tries,seconds:secs}).then(function(r){
      tabs[2].classList.add('done');
      var nx=nextLevel();
      var certs=(r.fresh||[]).map(function(c){return '<p style="color:#8a5a0c;font-weight:700">'+Q.icon('award')+' 獲得證書：'+Q.esc(c.name)+'</p>';}).join('');
      card.innerHTML='<div class="medal">'+Q.icon('check')+'</div><h2>過關！</h2><p>'+LV.code+' '+Q.esc(LV.title)+'</p>'+
        (r.noId?'<p style="color:#c0392b">還沒填年級、班級、座號，這次過關<b>沒有保存</b>。填好後再挑戰一次。</p>':'')+certs+
        '<div class="actions"><a class="go ghost" href="../">回地圖</a>'+(r.fresh&&r.fresh.length?'<a class="go ghost" href="../cert/?c='+r.fresh[0].id+'">看證書</a>':'')+(nx?'<a class="go" href="../'+nx.code+'/">下一關：'+Q.esc(nx.title)+'</a>':'')+'</div>';
      $('passBox').classList.add('on');
    });
  }

  /* ---------- 狀態 ---------- */
  Q.onChange(function(){
    var st=Q.status(LV.code);
    $('lvBadge').innerHTML=st==='passed'?'<span class="core" style="background:#e6f6ec;color:#2f9e62">已過關</span>':LV.core?'<span class="core">必修</span>':'';
    tabs[2].classList.toggle('done',st==='passed');
    var need=(LV.prereq||[]).filter(function(c){return !Q.passed(c);});
    $('lockNote').innerHTML=need.length?'<div class="tip">'+Q.icon('lock')+'<div>建議先完成 '+need.map(function(c){return '<a href="../'+c+'/">'+c+' '+Q.esc(Q.byCode[c].title)+'</a>';}).join('、')+'，這一關會比較容易。</div></div>':'';
  });
  Q.initIdBar();
  var h=(location.hash||'').slice(1);
  if(h==='practice'||h==='challenge')show(h);
})();
</script>
