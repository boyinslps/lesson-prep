<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="資訊老師黃博胤">
<title>查證複習</title>
<style>
:root{
  --bg:#f3f8fb; --ink:#1e293b; --mute:#64748b; --card:#fff;
  --teal:#0f766e; --teal-l:#ccfbf1; --amber:#b45309; --amber-l:#fef3c7; --sky:#0369a1; --sky-l:#e0f2fe;
  --green:#15803d; --green-l:#dcfce7; --rose:#be123c; --rose-l:#ffe4e6; --line:#cbd5e1;
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:12px 18px 90px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0 6px}
header.top h1{margin:0;font-size:1.5rem;color:var(--teal)}
.round{background:var(--teal);color:#fff;border-radius:999px;padding:2px 16px;font-weight:700;font-size:1rem}
.dots{display:flex;gap:8px;align-items:center;flex:1;min-width:240px}
.dots i{flex:1;height:14px;border-radius:999px;background:#d5dee6;max-width:70px}
.dots i.done{background:#5eead4}
.dots i.now{background:var(--teal)}
.card{background:var(--card);border:5px solid var(--teal-l);border-radius:28px;padding:22px 26px;margin-top:10px}
.card.sky{border-color:var(--sky-l)} .card.amber{border-color:var(--amber-l)} .card.green{border-color:var(--green-l)}
.stepno{display:inline-block;background:var(--amber);color:#fff;border-radius:12px;padding:0 14px;font-weight:800;font-size:1rem}
h2{font-size:1.9rem;margin:8px 0 4px;line-height:1.35}
.lead{font-size:1.35rem;margin:6px 0 12px}
.say{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--sky);color:var(--sky);background:#fff;border-radius:16px;padding:4px 16px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.say svg{width:22px;height:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:820px){.row{grid-template-columns:1fr}}
.msgimg{width:100%;border:3px solid var(--line);border-radius:16px;display:block;background:#fff}
.claim{background:var(--amber-l);border:4px solid #fcd34d;border-radius:20px;padding:14px 20px;font-size:1.45rem;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:20px;padding:12px 30px;font-size:1.35rem;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none}
.btn.main{background:var(--teal);color:#fff}
.btn.go{background:var(--sky);color:#fff}
.btn.ghost{background:#fff;color:var(--mute);border:3px solid var(--line)}
.btn.ok{background:var(--green);color:#fff}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.big{font-size:1.7rem;padding:18px 44px}
.btn.opt{background:#fff;color:var(--sky);border:3px solid var(--sky)}
.steps{list-style:none;padding:0;margin:10px 0}
.steps li{display:flex;gap:14px;align-items:flex-start;font-size:1.4rem;font-weight:700;margin:12px 0}
.steps .n{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
kbd{display:inline-block;background:#fff;border:3px solid #94a3b8;border-bottom-width:6px;border-radius:10px;padding:0 12px;font-family:inherit;font-weight:800;font-size:1.2rem;margin:0 2px}
.pill{display:inline-block;background:var(--sky-l);border:3px solid #7dd3fc;border-radius:14px;padding:2px 16px;font-weight:800}
.words{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}
.word{border:4px solid var(--line);background:#fff;border-radius:18px;padding:8px 24px;font-size:1.6rem;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink)}
.word.on{border-color:var(--green);background:var(--green-l);color:var(--green);cursor:default}
.word.no{border-color:#fdba74;background:#fff7ed}
.slots{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.slot{min-width:140px;height:3.2rem;border:4px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:var(--green)}
.slot.f{border:4px solid var(--green);background:var(--green-l)}
.slot.fix{border:4px solid #7dd3fc;background:var(--sky-l);color:var(--sky)}
.plus{font-size:1.6rem;font-weight:800;color:var(--mute)}
.msg{min-height:2.2rem;font-size:1.3rem;font-weight:700;margin:6px 0}
.msg.good{color:var(--green)} .msg.try{color:var(--amber)}
.vid{position:relative;border-radius:18px;overflow:hidden;background:#0f172a;margin-top:12px;min-height:120px}
.vid video{display:block;width:100%;cursor:pointer}
.vid .hint{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;border-radius:8px;padding:0 10px}
.vidcap{font-size:.95rem;color:var(--mute);margin:4px 0 0}
details.vd{margin-top:14px;background:#f8fafc;border:3px solid var(--line);border-radius:18px;padding:8px 16px}
details.vd summary{cursor:pointer;font-weight:800;font-size:1.25rem;color:var(--sky)}
.orgs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
@media(max-width:640px){.orgs{grid-template-columns:1fr}}
.org{text-align:left;border:4px solid var(--line);background:#fff;border-radius:20px;padding:10px 18px;font-family:inherit;color:var(--ink);cursor:pointer}
.org b{display:block;font-size:1.4rem}
.org span{font-size:.95rem;color:var(--mute)}
.org.good{border-color:var(--green);background:var(--green-l)}
.org.bad{border-color:#fdba74;background:#fff7ed}
.org p{margin:4px 0 0;font-size:1.05rem;font-weight:700}
.shot{position:relative}
.shot img{width:100%;display:block;border:3px solid var(--line);border-radius:14px}
.ring{position:absolute;border:6px solid #f59e0b;border-radius:16px;box-shadow:0 0 0 6px rgba(245,158,11,.3)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.legend div{border-radius:18px;padding:10px 18px;font-size:1.25rem;font-weight:700}
.legend .f{background:var(--rose-l);border:4px solid #fda4af}
.legend .t{background:var(--green-l);border:4px solid #86efac}
.judge{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0}
.judge .btn{flex:1;min-width:220px;font-size:2.2rem;padding:26px 20px;border:5px solid transparent}
.judge .real{background:var(--green-l);color:var(--green);border-color:#86efac}
.judge .fake{background:var(--rose-l);color:var(--rose);border-color:#fda4af}
.judge .btn.pick{outline:6px solid var(--sky)}
.result{border-radius:20px;padding:12px 20px;font-size:1.4rem;font-weight:800;margin-top:6px}
.result.good{background:var(--green-l);color:var(--green)}
.result.try{background:var(--amber-l);color:var(--amber)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0}
@media(max-width:820px){.tri{grid-template-columns:1fr}}
.tri div{background:#fff;border:5px solid var(--teal-l);border-radius:24px;padding:14px 18px}
.tri .big{width:3rem;height:3rem;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800}
.tri b{font-size:1.5rem;display:block;margin-top:6px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:4px solid var(--teal-l);padding:10px 18px;display:flex;justify-content:center;gap:20px;align-items:center;z-index:5}
nav.bar .why{font-size:1rem;color:var(--mute);min-width:0}
.sig{position:fixed;right:10px;bottom:84px;font-size:11px;color:#94a3b8;margin:0;z-index:6}
.fin{text-align:center}
.fin .stars{font-size:1rem}
.chk{display:inline-flex;vertical-align:middle;width:1.6rem;height:1.6rem}
.foot{font-size:.8rem;color:#94a3b8;margin:16px 0 0}
.linkcard{display:block;border:3px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;background:#fff;margin-top:10px}
.linkcard .ban{height:90px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800}
.linkcard .bd{padding:8px 16px;font-weight:700;font-size:1.05rem}
.linkcard .bd small{display:block;color:var(--mute);font-weight:500}
.qq{border:5px solid var(--line);border-radius:24px;padding:14px 20px;margin-top:14px;background:#fff}
.qq.right{border-color:#86efac;background:#f0fdf4}
.qq.wrong{border-color:#fdba74;background:#fff7ed}
.qq .judge .btn{font-size:1.8rem;padding:14px 10px}
.qq .tools{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.qq img.m{width:100%;max-width:420px;border:3px solid var(--line);border-radius:14px;display:block;margin-top:8px}
.rev{margin-top:10px;font-size:1.15rem;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>查證複習</h1>
    <span class="round" id="roundTag"></span>
    <div class="dots" id="dots"></div>
  </header>
  <main id="stage"></main>
  <p class="foot">查核報告畫面取自台灣事實查核中心、MyGoPen 麥擱騙。這一頁不用寫字，不會把你的答案送出去。</p>
</div>
<nav class="bar"><button class="btn ghost" id="prev" type="button">上一步</button><span class="why" id="why"></span><button class="btn main" id="next" type="button">下一步</button></nav>
<p class="sig">made by 資訊老師黃博胤</p>

<script>
(function(){
  /* ============ 資料：兩回，各一則訊息 ============ */
  var ORGS=[
    {name:'新聞網站',sub:'轉載別人的消息',ok:0,note:'新聞常常是轉載。要找到「原本的查核機構」。'},
    {name:'台灣事實查核中心',sub:'tfc-taiwan.org.tw',ok:1,note:'對！這是專門查謠言的查核機構。'},
    {name:'網友的貼文',sub:'臉書、論壇',ok:0,note:'網友的貼文，可能也是假的，不能當證據。'},
    {name:'MyGoPen 麥擱騙',sub:'mygopen.com',ok:1,note:'對！這也是專門查謠言的查核機構。'}
  ];
  var ROUNDS=[
    {
      name:'第 1 回',img:'assets/msg_H.png',alt:'臉書貼文：手機充電時在講電話，切記不能喝水，會倒電入心臟的。下面是一支男人邊講電話的短片。',
      claim:'手機充電時講電話，不能喝水，會電到心臟。',
      chips:[{t:'手機充電',k:1},{t:'講電話',k:1},{t:'切記',k:0,h:'「切記」是提醒的話，不是東西。換一個。'},{t:'不能',k:0,h:'「不能」不是東西，也不是事情。換一個。'},{t:'喝水',k:1},{t:'倒電入心臟',k:0,h:'這是訊息說的結果。先選「什麼東西、做什麼事」。'}],
      query:'手機充電 講電話 喝水 查核',
      report:{img:'assets/report_H.jpg',alt:'MyGoPen 的查核文章，標題前面有「錯誤」。',url:'https://www.mygopen.com/2022/01/Charging-Phone.html',org:'MyGoPen 麥擱騙',label:'錯誤',ring:{l:8,t:36,w:12,h:8}},
      guided:true,lens:true
    },
    {
      name:'第 2 回',img:'assets/msg_D.jpg',alt:'LINE 訊息：日本政府決定處理所有微波爐，因為微波爐加熱的食物有輻射。',
      claim:'日本要禁用微波爐，因為微波爐加熱的食物有輻射。',
      chips:[{t:'日本',k:1},{t:'廣島大學',k:0,h:'這是訊息裡的小細節。換一個。'},{t:'微波爐',k:1},{t:'工廠',k:0,h:'這不是最重要的字。換一個。'},{t:'輻射',k:1},{t:'禁用',k:0,h:'這是結果。先選「哪個國家、什麼東西」。'}],
      query:'微波爐 輻射 日本 查核',
      report:{img:'assets/report_D.jpg',alt:'台灣事實查核中心的文章，有一個紅色的「錯誤」標籤。',url:'https://tfc-taiwan.org.tw/fact-check-reports/migration-608/',org:'台灣事實查核中心',label:'錯誤',ring:{l:19.5,t:57,w:11.5,h:7}},
      guided:false,lens:false
    }
  ];
  var QUICK=[
    {t:'純天然的蜂蜜不會過期，放很久也不會壞',real:true,q:'蜂蜜 不會過期 查核',mode:'link',url:'https://www.facebook.com/enjoyeat8/videos/%E5%8E%9F%E4%BE%86%E7%B4%94%E5%A4%A9%E7%84%B6%E7%9A%84%E8%9C%82%E8%9C%9C%E6%B2%92%E6%9C%89%E9%81%8E%E6%9C%9F%E9%80%99%E5%80%8B%E8%AA%AA%E6%B3%95-%E7%A7%91%E6%99%AE%E4%B8%80%E4%B8%8B-%E5%86%B7%E7%9F%A5%E8%AD%98-%E7%A7%91%E6%99%AE/3108692545974858/',title:'原來純天然的蜂蜜沒有過期！科普一下冷知識',site:'facebook.com',truth:'真的！純蜂蜜很濃、又有天然的抗菌力，蓋好保存幾乎不會壞。'},
    {t:'牙膏管底的黑色條紋，代表裡面含有化學成分',real:false,q:'牙膏 黑色條紋 化學成分 查核',mode:'img',src:'assets/msg_tooth.jpg',alt:'牙膏管底部的色條，黑色色條代表含化學成分的說法。',truth:'假的！那只是機器用來對準的「色條」，跟成分沒有關係。'},
    {t:'酷暑天喝冰水，會導致血管爆裂或中風',real:false,q:'喝冰水 血管爆裂 查核',mode:'link',url:'https://www.cmoney.tw/forum/article/179361052',title:'網傳「熱天喝冰水血管會爆裂」是真的嗎？',site:'cmoney.tw',truth:'假的！喝冰水不會讓血管爆裂，這是被誇大的錯誤說法。'}
  ];
  var KEY='sp_detective_v1';
  var S={i:0,kw:[{},{}],copied:[0,0],ack:{},org:[{},{}],judged:[0,0],pick:[null,null],qk:{}};
  try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.kw){S=o;if(!S.qk)S.qk={};}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

  /* ============ 步驟清單 ============ */
  var STEPS=[{k:'intro',r:-1}];
  ROUNDS.forEach(function(R,r){['view','kw','google','find'].concat(R.lens?['lens']:[],['label','judge']).forEach(function(k){STEPS.push({k:k,r:r});});});
  STEPS.push({k:'quick',r:-1});
  STEPS.push({k:'end',r:-1});

  var ICON_SAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var ICON_OK='<svg class="chk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#16a34a"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
  function sayBtn(t){return '';}
  function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
  function vid(name,cap,collapsed,title){
    var h='<div class="vid" data-src="assets/'+name+'.mp4" data-poster="assets/'+name+'_封面.jpg"></div><p class="vidcap">'+cap+'（點一下影片可以暫停）</p>';
    return collapsed?'<details class="vd"><summary>'+(title||'看影片')+'</summary>'+h+'</details>':h;
  }
  function mount(m){
    if(m.querySelector('video'))return;
    var v=document.createElement('video');v.src=m.dataset.src;v.poster=m.dataset.poster;v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;
    v.setAttribute('playsinline','');
    v.addEventListener('click',function(){if(v.paused)v.play();else v.pause();});
    m.appendChild(v);var h=document.createElement('span');h.className='hint';h.textContent='點一下暫停';m.appendChild(h);
    var p=v.play();if(p&&p.catch)p.catch(function(){});
  }
  function mountAll(){
    [].forEach.call(document.querySelectorAll('.vid'),function(m){
      var d=m.closest('details');
      if(d){if(d.open)mount(m);d.addEventListener('toggle',function(){if(d.open)mount(m);});}else mount(m);
    });
  }

  /* ============ 各步驟畫面 ============ */
  function head(st,R,n,total,title,lead){
    return '<span class="stepno">第 '+n+' 步</span><h2>'+title+'</h2><p class="lead">'+lead+'</p>';
  }
  function keycaps(){return '<kbd>Ctrl</kbd> ＋ <kbd>V</kbd>';}
  var VIEW={
    intro:function(){
      return '<div class="card"><h2>查證複習</h2>'+
        '<p class="lead">有一則訊息在網路上傳來傳去。<b>它是真的，還是假的？</b>我們一起查查看。</p>'+sayBtn('今天我們當查證小偵探。有一則訊息在網路上傳來傳去。它是真的，還是假的？我們一起查查看。')+
        '<div class="tri"><div><span class="big">1</span><b>找關鍵字</b>選出最重要的字，按一下就複製。</div>'+
        '<div><span class="big">2</span><b>找查核報告</b>到 Google 找，專門查謠言的機構。</div>'+
        '<div><span class="big">3</span><b>選答案</b>真的？假的？按一下就好。</div></div>'+
        '<p class="lead"><b>全部都不用寫字。</b>一次只做一件事，慢慢來。</p></div>';
    },
    view:function(st,R){
      return '<div class="card sky">'+head(st,R,st.n,st.total,'看訊息','先看一看，這則訊息在說什麼？')+
        '<div class="row"><div><img class="msgimg" src="'+R.img+'" alt="'+esc(R.alt)+'"></div>'+
        '<div><p class="claim">這則訊息說：<br>「'+R.claim+'」</p>'+sayBtn('這則訊息說：'+R.claim)+
        '<p class="lead" style="margin-top:14px">它是真的嗎？我們要<b>查證</b>。</p></div></div></div>';
    },
    kw:function(st,R){
      var r=st.r,sel=S.kw[r]||{},n=0,slots='';
      R.chips.forEach(function(c,i){if(sel[i]){n++;}});
      var filled=R.chips.filter(function(c,i){return sel[i];});
      for(var i=0;i<3;i++)slots+='<span class="slot'+(filled[i]?' f':'')+'">'+(filled[i]?filled[i].t:'')+'</span>';
      var words=R.chips.map(function(c,i){return '<button type="button" class="word'+(sel[i]?' on':'')+'" data-w="'+i+'">'+c.t+'</button>';}).join('');
      var done=n>=3;
      return '<div class="card sky">'+head(st,R,st.n,st.total,'選出關鍵字',R.guided?'關鍵字是<b>最重要的字</b>：是什麼東西？在做什麼事？<br>點下面的字，選出 <b>3 個</b>。':'再選出 <b>3 個</b>關鍵字。')+
        '<p class="claim" style="font-size:1.2rem">「'+R.claim+'」</p>'+
        '<div class="words">'+words+'</div><div class="msg" id="kwmsg"></div>'+
        '<p class="lead" style="margin:6px 0 0">你的關鍵字：</p><div class="slots">'+slots+'<span class="plus">＋</span><span class="slot fix">查核</span></div>'+
        '<p class="lead" style="margin:2px 0 8px">「查核」兩個字，會自動加上去。</p>'+
        (done?'<button type="button" class="btn go big" id="copyBtn">'+(S.copied[r]?'已複製！再按一次也可以':'按這裡，複製關鍵字')+'</button>':'<button type="button" class="btn go big" disabled>選滿 3 個，才能複製</button>')+
        (R.guided?vid('v_keyword','影片：選 3 個關鍵字，按「複製」',false):'')+'</div>';
    },
    google:function(st,R){
      var r=st.r,ack=S.ack['g'+r];
      return '<div class="card">'+head(st,R,st.n,st.total,'到 Google，貼上關鍵字','剛剛複製的關鍵字，要貼到 Google。')+
        '<a class="btn go big" href="https://www.google.com/" target="_blank" rel="noopener">1　打開 Google</a>'+
        '<ol class="steps"><li><span class="n">2</span>點一下<b>搜尋框</b></li><li><span class="n">3</span>按 '+keycaps()+'　<span style="font-weight:500;font-size:1.1rem">（貼上）</span></li><li><span class="n">4</span>按 <kbd>Enter</kbd></li></ol>'+
        '<p class="lead">貼上以後，搜尋框裡會是：<span class="pill">'+R.query+'</span></p>'+
        vid('v_google','影片：貼上關鍵字、按 Enter',!R.guided,'不會貼？看影片')+
        '<p style="margin-top:16px"><button type="button" class="btn '+(ack?'ok':'opt')+'" data-ack="g'+r+'">'+(ack?'我做好了':'做好了，按這裡')+'</button></p></div>';
    },
    find:function(st,R){
      var r=st.r,o=S.org[r]||{};
      var cards=ORGS.map(function(g,i){
        var c=o[i]===1?' good':(o[i]===2?' bad':'');
        return '<button type="button" class="org'+c+'" data-o="'+i+'"><b>'+g.name+'</b><span>'+g.sub+'</span>'+(o[i]?'<p>'+g.note+'</p>':'')+'</button>';
      }).join('');
      return '<div class="card amber">'+head(st,R,st.n,st.total,'找到「查核機構」的報告','最上面的「<b>AI 摘要</b>」可以先讀，它會告訴你大概。<br>要<b>確定</b>，就往下找<b>專門查謠言</b>的機構，點進去看。')+
        vid('v_find','影片：往下找，點進查核機構的文章',!R.guided,'不會找？看影片')+
        '<p class="lead" style="margin-top:14px"><b>練習：</b>哪些是查核機構？點一點（要選 2 個）。</p><div class="orgs">'+cards+'</div>'+
        '<p><a class="btn opt" href="'+R.report.url+'" target="_blank" rel="noopener">找不到嗎？按這裡，直接打開查核報告</a></p></div>';
    },
    lens:function(st,R){
      var ack=S.ack['l'+st.r];
      return '<div class="card amber">'+head(st,R,st.n,st.total,'方法二：智慧鏡頭','關鍵字找不到，或是<b>圖片、影片</b>的時候，用智慧鏡頭。')+
        '<div class="row"><div><ol class="steps"><li><span class="n">1</span>在圖片上，按<b>滑鼠右鍵</b></li><li><span class="n">2</span>選「透過 Google <b>智慧鏡頭</b>搜尋圖片」</li><li><span class="n">3</span>用滑鼠<b>拖曳框住</b>整張圖片</li><li><span class="n">4</span>往下找<b>查核機構</b>的文章</li></ol>'+
        '<p class="lead"><b>試試看：</b>在右邊的圖片上，按滑鼠右鍵。</p>'+
        '<p><button type="button" class="btn '+(ack?'ok':'opt')+'" data-ack="l'+st.r+'">'+(ack?'我看懂了':'看懂了，按這裡')+'</button></p></div>'+
        '<div><img class="msgimg" src="'+R.img+'" alt="'+esc(R.alt)+'">'+vid('v_lens','影片：用智慧鏡頭搜尋圖片',false)+'</div></div></div>';
    },
    label:function(st,R){
      var p=R.report,g=p.ring;
      return '<div class="card green">'+head(st,R,st.n,st.total,'看標籤','打開查核報告，看<b>標題前面的標籤</b>。')+
        '<div class="row"><div class="shot"><img src="'+p.img+'" alt="'+esc(p.alt)+'"><div class="ring" style="left:'+g.l+'%;top:'+g.t+'%;width:'+g.w+'%;height:'+g.h+'%"></div></div>'+
        '<div><p class="claim">'+p.org+'<br>標籤：<span style="color:var(--rose)">'+p.label+'</span></p>'+sayBtn(p.org+'說，這則訊息的標籤是'+p.label)+
        '<div class="legend"><div class="f">錯誤、詐騙、誤導<br>＝ 假的</div><div class="t">正確<br>＝ 真的</div></div>'+
        vid('v_label','影片：看標題前面的標籤',!R.guided,'不會看？看影片')+
        '<p style="margin-top:14px"><a class="btn opt" href="'+p.url+'" target="_blank" rel="noopener">打開真的查核報告</a></p></div></div></div>';
    },
    judge:function(st,R){
      var r=st.r,pk=S.pick[r],good=S.judged[r];
      var res='';
      if(pk==='fake')res='<div class="result good">答對了！查核機構標了「'+R.report.label+'」，所以這則訊息是<b>假的</b>。</div>';
      else if(pk==='real')res='<div class="result try">再看一次標籤。標籤是「'+R.report.label+'」。再選一次。</div>';
      return '<div class="card sky">'+head(st,R,st.n,st.total,'選一選：真的，還是假的？','想一想標籤，再按一下。')+
        '<p class="claim" style="font-size:1.2rem">「'+R.claim+'」</p>'+
        '<div class="judge"><button type="button" class="btn real'+(pk==='real'?' pick':'')+'" data-j="real">真的</button><button type="button" class="btn fake'+(pk==='fake'?' pick':'')+'" data-j="fake">假的</button></div>'+res+'</div>';
    },
    quick:function(){
      var h='';
      QUICK.forEach(function(it,i){
        var st=S.qk[i],cls='qq'+(st==='ok'?' right':(st==='no'?' wrong':''));
        var med=it.mode==='img'?'<img class="m" src="'+it.src+'" alt="'+esc(it.alt)+'">':'<a class="linkcard" href="'+it.url+'" target="_blank" rel="noopener"><div class="ban">Facebook 貼文</div><div class="bd">'+esc(it.title)+'<small>'+esc(it.site)+'　（按一下打開文章）</small></div></a>';
        if(it.mode==='link'&&it.site!=='facebook.com')med='<a class="linkcard" href="'+it.url+'" target="_blank" rel="noopener"><div class="ban">'+esc(it.site)+'</div><div class="bd">'+esc(it.title)+'<small>'+esc(it.site)+'　（按一下打開文章）</small></div></a>';
        var rv='';
        if(st==='ok')rv='<div class="rev" style="color:var(--green)">答對了！'+esc(it.truth)+'</div>';
        else if(st==='no')rv='<div class="rev" style="color:var(--amber)">再想一想。可以用「複製關鍵字」查查看，再選一次。</div>';
        h+='<div class="'+cls+'"><span class="stepno">第 '+(i+1)+' 則</span><p class="claim" style="font-size:1.3rem">'+esc(it.t)+'</p>'+med+
          '<div class="tools"><button type="button" class="btn opt" data-qcopy="'+i+'">複製關鍵字</button><a class="btn go" href="https://www.google.com/" target="_blank" rel="noopener">打開 Google</a></div>'+
          '<div class="judge"><button type="button" class="btn real" data-q="'+i+'" data-a="1"'+(st==='ok'?' disabled':'')+'>真的</button><button type="button" class="btn fake" data-q="'+i+'" data-a="0"'+(st==='ok'?' disabled':'')+'>假的</button></div>'+rv+'</div>';
      });
      return '<div class="card sky"><span class="stepno">快問快答</span><h2>練習：真的，還是假的？</h2><p class="lead">先查一查，再選。選了馬上告訴你對不對。<b>這裡只是練習，不會送出。</b></p>'+h+'</div>';
    },
    end:function(){
      return '<div class="card green fin"><h2>複習完成了！</h2><p class="lead"><b>你學會了查證的 3 件事：</b></p>'+
        '<div class="tri" style="text-align:left"><div><span class="big">1</span><b>找關鍵字</b>複製關鍵字，貼到 Google。</div><div><span class="big">2</span><b>找查核報告</b>認得查核機構。</div><div><span class="big">3</span><b>看標籤</b>錯誤、詐騙＝假的。</div></div>'+
        '<p class="lead">以後看到奇怪的訊息，先查一查，再決定要不要轉傳。</p>'+
        '<p><a class="btn go big" href="../g5-answer/">去作答</a></p><p style="margin-top:18px"><button type="button" class="btn ghost" id="again">再複習一次</button></p></div>';
    }
  };

  /* ============ 畫面更新 ============ */
  function gate(st){
    var r=st.r;
    if(st.k==='kw')return S.copied[r]?'':'先選 3 個關鍵字，再按「複製」';
    if(st.k==='google')return S.ack['g'+r]?'':'做好了，才能按下一步';
    if(st.k==='find'){var o=S.org[r]||{};return(o[1]===1&&o[3]===1)?'':'先選出 2 個查核機構';}
    if(st.k==='lens')return S.ack['l'+r]?'':'看懂了，才能按下一步';
    if(st.k==='judge')return S.judged[r]?'':'選出答案，才能按下一步';
    if(st.k==='quick')return QUICK.every(function(x,i){return S.qk[i]==='ok';})?'':'3 則都答對，才能按下一步';
    return '';
  }
  function render(){
    var st=STEPS[S.i],R=st.r>=0?ROUNDS[st.r]:null;
    var inRound=STEPS.filter(function(x){return x.r===st.r&&st.r>=0;});
    st.total=inRound.length;st.n=inRound.indexOf(st)+1;
    $('stage').innerHTML=VIEW[st.k](st,R);
    $('roundTag').textContent=R?R.name:(st.k==='end'?'完成':(st.k==='quick'?'快問快答':'開始'));
    $('dots').innerHTML=inRound.map(function(x,k){return '<i class="'+(k+1<st.n?'done':(k+1===st.n?'now':''))+'"></i>';}).join('');
    var g=gate(st);
    $('why').textContent=g;
    $('next').disabled=!!g;
    $('next').textContent=(st.k==='end')?'回第一頁':(st.k==='intro'?'開始':'下一步');
    $('prev').style.visibility=S.i===0?'hidden':'visible';
    $('next').style.display=(st.k==='end')?'none':'';
    mountAll();bind(st,R);
    window.scrollTo(0,0);
  }
  function refresh(){ // 不捲到最上面的更新
    var y=window.scrollY;render();window.scrollTo(0,y);
  }
  function bind(st,R){
    [].forEach.call(document.querySelectorAll('[data-say]'),function(b){b.onclick=function(){say(b.dataset.say);};});
    [].forEach.call(document.querySelectorAll('[data-ack]'),function(b){b.onclick=function(){S.ack[b.dataset.ack]=1;save();refresh();};});
    var r=st.r;
    [].forEach.call(document.querySelectorAll('[data-w]'),function(b){
      b.onclick=function(){
        var i=+b.dataset.w,c=R.chips[i];
        if((S.kw[r]||{})[i])return;
        if(c.k){S.kw[r][i]=1;S.copied[r]=0;save();refresh();var m=$('kwmsg');if(m){m.className='msg good';m.textContent='對！「'+c.t+'」是關鍵字。';}}
        else{b.classList.add('no');var m2=$('kwmsg');m2.className='msg try';m2.textContent=c.h;}
      };
    });
    var cb=$('copyBtn');
    if(cb)cb.onclick=function(){
      copyText(R.query,function(){S.copied[r]=1;save();refresh();});
    };
    [].forEach.call(document.querySelectorAll('[data-o]'),function(b){
      b.onclick=function(){var i=+b.dataset.o;S.org[r][i]=ORGS[i].ok?1:2;save();refresh();};
    });
    [].forEach.call(document.querySelectorAll('[data-j]'),function(b){
      b.onclick=function(){
        S.pick[r]=b.dataset.j;if(b.dataset.j==='fake')S.judged[r]=1;save();refresh();
      };
    });
    [].forEach.call(document.querySelectorAll('[data-qcopy]'),function(b){b.onclick=function(){copyText(QUICK[+b.dataset.qcopy].q,function(){var o=b.textContent;b.textContent='已複製！';setTimeout(function(){b.textContent=o;},1500);});};});
    [].forEach.call(document.querySelectorAll('[data-q]'),function(b){b.onclick=function(){var i=+b.dataset.q;S.qk[i]=((b.dataset.a==='1')===QUICK[i].real)?'ok':'no';save();refresh();};});
    var ag=$('again');if(ag)ag.onclick=function(){S={i:0,kw:[{},{}],copied:[0,0],ack:{},org:[{},{}],judged:[0,0],pick:[null,null],qk:{}};save();render();};
  }
  function copyText(text,done){
    function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done();}
    try{navigator.clipboard.writeText(text).then(done,fb);}catch(e){fb();}
  }
  $('next').onclick=function(){if(S.i<STEPS.length-1){S.i++;save();render();}};
  $('prev').onclick=function(){if(S.i>0){S.i--;save();render();}};
  if(S.i>=STEPS.length)S.i=0;
  render();
})();
</script>
</body>
</html>
