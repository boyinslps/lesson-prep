<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="author" content="資訊老師黃博胤">
<title>示意畫面：自己在雲端硬碟開一份文件</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:#f6f8fc;color:#1f1f1f}
  .top{height:64px;display:flex;align-items:center;gap:20px;padding:0 20px}
  .logo{font-size:22px;color:#444;width:200px}
  .search{flex:1;max-width:620px;height:44px;border-radius:24px;background:#e9eef6;display:flex;align-items:center;padding:0 18px;color:#666;font-size:16px}
  .avatar{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#1a73e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
  .body{display:flex;height:calc(720px - 64px - 78px)}
  .side{width:240px;padding:8px 12px}
  .new{width:120px;height:56px;border-radius:16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;color:#1f1f1f}
  .nav div{height:40px;border-radius:20px;padding:0 16px;display:flex;align-items:center;font-size:16px;color:#333;margin-top:2px}
  .nav .on{background:#c2e7ff;font-weight:700}
  .main{flex:1;background:#fff;border-radius:16px;margin:0 16px 0 0;padding:20px 28px}
  .main h2{margin:0 0 18px;font-weight:400;font-size:24px}
  .cards{display:flex;gap:14px;flex-wrap:wrap}
  .folder{width:210px;height:52px;background:#f0f4f9;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px}
  .menu{position:absolute;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:6px 0;font-size:16px;z-index:5}
  .menu div{height:40px;padding:0 20px;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .menu hr{border:0;border-top:1px solid #ddd;margin:4px 0}
  .menu .hl{background:#e8f0fe}
  /* 文件畫面 */
  .doc{position:absolute;left:0;top:0;width:1280px;height:642px;background:#f9fbfd;z-index:8}
  .doc .bar{height:64px;display:flex;align-items:center;gap:14px;padding:0 20px}
  .doc .icon{width:30px;height:38px;background:#4285f4;border-radius:4px}
  .doc .title{font-size:20px;padding:4px 8px;border-radius:6px;min-width:120px}
  .doc .title.edit{border:2px solid #1a73e8;background:#fff}
  .doc .mbar{height:28px;padding:0 70px;font-size:14px;color:#444;display:flex;gap:22px}
  .doc .tool{height:40px;margin:6px 60px;background:#edf2fa;border-radius:20px}
  .doc .paper{position:absolute;left:300px;top:150px;width:680px;height:500px;background:#fff;box-shadow:0 0 0 1px #ddd;padding:48px 60px;font-size:17px;line-height:1.6;color:#222;overflow:hidden}
  .doc .paper p{margin:0}
  /* 游標、圈選、字卡 */
  .cursor{position:absolute;z-index:20;width:30px;height:30px}
  .ring{position:absolute;z-index:19;border:5px solid #e0245e;border-radius:14px}
  .arrow{position:absolute;z-index:19;color:#e0245e;font-size:64px;font-weight:900;line-height:1}
  .cap{position:absolute;left:0;bottom:0;width:1280px;height:78px;background:#101a3d;z-index:30;display:flex;align-items:center;gap:20px;padding:0 28px}
  .cap .n{width:48px;height:48px;border-radius:50%;background:#f5c518;color:#101a3d;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
  .cap .t{color:#fff;font-size:30px;font-weight:700}
  .cap .by{margin-left:auto;color:#9fb0e0;font-size:15px}
  .tag{position:absolute;right:16px;top:10px;z-index:40;background:#fff3cd;border:2px solid #f0b400;color:#7a5600;font-size:15px;font-weight:700;border-radius:8px;padding:2px 10px}
</style>
</head>
<body>
<div class="tag">示意畫面</div>
<div id="stage"></div>
<script>
var S=parseInt((location.search.match(/s=(\d+)/)||[0,1])[1],10);
var CAP={1:'按左上角的「新增」',2:'選「Google 文件」',3:'選「空白文件」',4:'新的空白文件開好了',5:'點名稱，改成「台詞表」',6:'按 Ctrl+V，貼上複製的台詞表'};
function drive(){
  return '<div class="top"><div class="logo">雲端硬碟</div><div class="search">在雲端硬碟中搜尋</div><div class="avatar">我</div></div>'+
  '<div class="body"><div class="side"><div class="new" id="newbtn"><span style="font-size:28px">＋</span>新增</div>'+
  '<div class="nav" style="margin-top:14px"><div class="on">我的雲端硬碟</div><div>電腦</div><div>與我共用</div><div>近期存取</div><div>已加星號</div></div></div>'+
  '<div class="main"><h2>我的雲端硬碟</h2><div class="cards"><div class="folder">📁 作業</div><div class="folder">📁 照片</div><div class="folder">📁 影片素材</div></div></div></div>';
}
function menu1(hlIdx){
  var items=['資料夾','—','檔案上傳','資料夾上傳','—','Google 文件 ▸','Google 試算表 ▸','Google 簡報 ▸','Google 表單 ▸'];
  var h='<div class="menu" style="left:16px;top:150px;width:300px">';
  items.forEach(function(t,i){ if(t==='—')h+='<hr>'; else h+='<div'+(i===hlIdx?' class="hl"':'')+'>'+t+'</div>'; });
  return h+'</div>';
}
function menu2(){
  return '<div class="menu" style="left:318px;top:296px;width:240px"><div class="hl">空白文件</div><div>從範本建立</div></div>';
}
function doc(titleText,edit,paper){
  return '<div class="doc"><div class="bar"><div class="icon"></div><div class="title'+(edit?' edit':'')+'" id="dt">'+titleText+'</div></div>'+
  '<div class="mbar"><span>檔案</span><span>編輯</span><span>檢視</span><span>插入</span><span>格式</span><span>工具</span></div><div class="tool"></div>'+
  '<div class="paper">'+paper+'</div></div>';
}
var PASTE='<p style="font-weight:700">我的台詞表</p><p>我的主題：</p><p>類型：謠言</p><p>開頭句：有人說：打雷時用手機，會被雷劈？</p><p>來源網址：https://tfc-taiwan.org.tw/…</p><p>核心訊息：打雷要躲進室內，別待在空曠處。</p><p>&nbsp;</p><p>我找到的資料（3～5 句，用自己的話）：</p><p>&nbsp;</p><p>第 1 句（①問題）：</p><p>關鍵字：</p>';
var cur='<svg class="cursor" id="cur" viewBox="0 0 24 24"><path d="M3 2l7 19 3-8 8-3z" fill="#111" stroke="#fff" stroke-width="1.5"/></svg>';
var h='', pos=[0,0], ring=null, arrow=null;
if(S===1){h=drive();pos=[78,100];ring=[8,66,132,68];arrow=[146,70];}
if(S===2){h=drive()+menu1(5);pos=[120,314];ring=[16,288,300,44];}
if(S===3){h=drive()+menu1(5)+menu2();pos=[400,316];ring=[318,296,240,44];}
if(S===4){h=drive()+doc('未命名文件',false,'<p>&nbsp;</p>');pos=[600,300];}
if(S===5){h=drive()+doc('台詞表',true,'<p>&nbsp;</p>');pos=[90,34];ring=[40,16,150,46];}
if(S===6){h=drive()+doc('台詞表',false,PASTE);pos=[640,420];}
var ringH=ring?'<div class="ring" style="left:'+ring[0]+'px;top:'+ring[1]+'px;width:'+ring[2]+'px;height:'+ring[3]+'px"></div>':'';
var arrowH=arrow?'<div class="arrow" style="left:'+arrow[0]+'px;top:'+arrow[1]+'px">⬅</div>':'';
var curH=cur.replace('id="cur"','style="left:'+pos[0]+'px;top:'+pos[1]+'px"');
var cap='<div class="cap"><div class="n">'+S+'</div><div class="t">'+CAP[S]+'</div><div class="by">made by 資訊老師黃博胤</div></div>';
document.getElementById('stage').innerHTML=h+ringH+arrowH+curH+cap;
</script>
</body>
</html>
